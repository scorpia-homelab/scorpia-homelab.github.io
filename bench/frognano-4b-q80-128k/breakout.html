<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Breakout</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #94a3b8;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through */
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .score-val { color: #38bdf8; }
        .lives-val { color: #f472b6; }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Heads Up Display -->
    <div id="hud">
        <span class="score-val">Score: <span id="scoreEl">0</span></span>
        <span class="lives-val">Lives: <span id="livesEl">3</span></span>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="ui-layer">
        <h1>Neon Breakout</h1>
        <p>Move mouse or touch to control paddle</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-layer hidden">
        <h1 id="endTitle">Game Over</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>
</div>

<script>
    /** 
     * CONFIGURATION & SETUP 
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const endTitle = document.getElementById('endTitle');

    // Game Constants
    const PADDLE_WIDTH = 100;
    const PADDLE_HEIGHT = 15;
    const BALL_RADIUS = 8;
    const BRICK_ROW_COUNT = 6;
    const BRICK_COLUMN_COUNT = 9;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 60;
    const BRICK_OFFSET_LEFT = 35;
    const BRICK_HEIGHT = 25;
    // Calculate brick width dynamically based on canvas size
    const BRICK_WIDTH = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_COLUMN_COUNT - 1))) / BRICK_COLUMN_COUNT;

    // Colors for bricks (gradient effect)
    const brickColors = ['#ef476f', '#ff006e', '#f72585', '#b5179e', '#7209b7', '#4c1d95'];

    /** 
     * GAME STATE VARIABLES 
     */
    let score = 0;
    let lives = 3;
    let isGameRunning = false;
    let animationId;

    // Paddle State
    const paddleX = (canvas.width - PADDLE_WIDTH) / 2;
    
    // Ball State
    let x, y, dx, dy;
    const INITIAL_SPEED = 5;
    
    // Bricks Array
    let bricks = [];

    // Particles Array for effects
    let particles = [];

    /** 
     * AUDIO SYSTEM (Synthesized) 
     */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'brick') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'lose') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    /** 
     * INITIALIZATION & INPUT 
     */
    
    function initBricks() {
        bricks = [];
        for(let c=0; c<BRICK_COLUMN_COUNT; c++) {
            bricks[c] = [];
            for(let r=0; r<BRICK_ROW_COUNT; r++) {
                // Determine color based on row
                const colorIndex = r % brickColors.length; 
                bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[colorIndex] };
            }
        }
    }

    function resetBall() {
        x = canvas.width / 2;
        y = canvas.height - 30;
        dx = INITIAL_SPEED * (Math.random() > 0.5 ? 1 : -1); // Random start direction
        dy = -INITIAL_SPEED;
        paddleX = (canvas.width - PADDLE_WIDTH) / 2;
    }

    function createParticles(x, y, color) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x,
                y: y,
                dx: (Math.random() - 0.5) * 4,
                dy: (Math.random() - 0.5) * 4,
                life: 1.0,
                color: color
            });
        }
    }

    // Mouse/Touch Input
    function movePaddle(clientX) {
        const relativeX = clientX - canvas.offsetLeft;
        if(relativeX > 0 && relativeX < canvas.width) {
            paddleX = relativeX - PADDLE_WIDTH / 2;
            
            // Clamp to screen
            if(paddleX < 0) paddleX = 0;
            if(paddleX + PADDLE_WIDTH > canvas.width) paddleX = canvas.width - PADDLE_WIDTH;
        }
    }

    canvas.addEventListener('mousemove', (e) => {
        if(isGameRunning) movePaddle(e.clientX);
    });
    
    // Touch support for mobile
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Stop scrolling
        if(isGameRunning) movePaddle(e.touches[0].clientX);
    }, {passive: false});

    /** 
     * GAME LOGIC 
     */

    function collisionDetection() {
        for(let c=0; c<BRICK_COLUMN_COUNT; c++) {
            for(let r=0; r<BRICK_ROW_COUNT; r++) {
                const b = bricks[c][r];
                if(b.status === 1) {
                    // Simple AABB collision check
                    if(x > b.x && x < b.x + BRICK_WIDTH && y > b.y && y < b.y + BRICK_HEIGHT) {
                        dy = -dy;
                        b.status = 0;
                        score += 10;
                        scoreEl.innerText = score;
                        playSound('brick');
                        createParticles(b.x + BRICK_WIDTH/2, b.y + BRICK_HEIGHT/2, b.color);

                        // Check Win Condition
                        if(score === BRICK_ROW_COUNT * BRICK_COLUMN_COUNT * 10) {
                            endGame(true);
                        }
                    }
                }
            }
        }
    }

    function update() {
        if(!isGameRunning) return;

        // Move Ball
        x += dx;
        y += dy;

        // Wall Collision (Left/Right)
        if(x + dx > canvas.width - BALL_RADIUS || x + dx < BALL_RADIUS) {
            dx = -dx;
            playSound('hit');
        }

        // Ceiling Collision
        if(y + dy < BALL_RADIUS) {
            dy = -dy;
            playSound('hit');
        } 
        // Floor Collision (Life Loss)
        else if(y + dy > canvas.height - BALL_RADIUS) {
            lives--;
            livesEl.innerText = lives;
            playSound('lose');
            
            if(!lives) {
                endGame(false);
            } else {
                resetBall();
            }
        }

        // Paddle Collision
        // Check if ball is within paddle vertical area and horizontal overlap
        if(y + BALL_RADIUS >= canvas.height - PADDLE_HEIGHT && y - BALL_RADIUS <= canvas.height) {
            if(x > paddleX && x < paddleX + PADDLE_WIDTH) {
                // Calculate hit position relative to center of paddle (-1 to 1)
                let collidePoint = x - (paddleX + PADDLE_WIDTH / 2);
                collidePoint = collidePoint / (PADDLE_WIDTH / 2);

                // Angle calculation: Max angle is roughly 60 degrees (PI/3)
                const angle = collidePoint * (Math.PI / 3); 

                dx = INITIAL_SPEED * Math.sin(angle);
                dy = -INITIAL_SPEED * Math.cos(angle);
                
                playSound('hit');
            }
        }

        collisionDetection();

        // Update Particles
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.dx;
            p.y += p.dy;
            p.life -= 0.05;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Clear Canvas with trail effect (optional, but clean clear is better for arcade feel)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Bricks
        for(let c=0; c<BRICK_COLUMN_COUNT; c++) {
            for(let r=0; r<BRICK_ROW_COUNT; r++) {
                if(bricks[c][r].status === 1) {
                    const brickX = (c * (BRICK_WIDTH + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                    const brickY = (r * (BRICK_HEIGHT + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                    
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;

                    ctx.beginPath();
                    ctx.rect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT);
                    ctx.fillStyle = bricks[c][r].color;
                    // Add a slight glow
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = bricks[c][r].color;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0; // Reset shadow for performance
                }
            }
        }

        // Draw Paddle
        ctx.beginPath();
        ctx.roundRect(paddleX, canvas.height - PADDLE_HEIGHT, PADDLE_WIDTH, PADDLE_HEIGHT, 5);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        // Draw Ball
        ctx.beginPath();
        ctx.arc(x, y, BALL_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = 'white';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'white';
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        // Draw Particles
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.closePath();
            ctx.globalAlpha = 1.0;
        });

        if(isGameRunning) {
            animationId = requestAnimationFrame(() => {
                update();
                draw();
            });
        } else {
            cancelAnimationFrame(animationId);
        }
    }

    /** 
     * GAME FLOW CONTROL 
     */

    function startGame() {
        score = 0;
        lives = 3;
        scoreEl.innerText = score;
        livesEl.innerText = lives;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        initBricks();
        resetBall();
        isGameRunning = true;
        draw(); // Start loop immediately
    }

    function endGame(win) {
        isGameRunning = false;
        finalScoreEl.innerText = score;
        
        if(win) {
            endTitle.innerText = "YOU WIN!";
            endTitle.style.color = "#4ade80";
            playSound('win');
        } else {
            endTitle.innerText = "GAME OVER";
            endTitle.style.color = "#ef476f";
            playSound('lose');
        }
        
        gameOverScreen.classList.remove('hidden');
    }

    function resetGame() {
        startGame();
    }

    // Initial Draw (Background)
    draw();

</script>
</body>
</html>
