<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot vs Julia Set</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --text-color: #eee;
            --accent: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            height: 100vh;
        }

        /* Layout Containers */
        .container {
            position: relative;
            width: 50%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Labels */
        .label {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Controls Panel */
        #controls {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; color: #aaa; }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            float: right;
            color: var(--accent);
            font-family: monospace;
        }

        button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        button:hover { background-color: var(--accent); }

        /* Responsive Design */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto;}
            .container { width: 100%; height: 50vh; }
            #controls { 
                width: 100%; 
                height: auto; 
                box-sizing: border-box;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Left Panel: Mandelbrot -->
    <div class="container">
        <canvas id="mandelbrotCanvas"></canvas>
        <div class="label">Mandelbrot Set</div>
    </div>

    <!-- Right Panel: Julia -->
    <div class="container">
        <canvas id="juliaCanvas"></canvas>
        <div class="label">Julia Set (Interactive)</div>
    </div>

    <!-- Sidebar Controls -->
    <div id="controls">
        <h2>Fractal Controls</h2>
        
        <div class="control-group">
            <label for="juliaReal">Julia Real Part (Re): <span id="val-real" class="value-display">-0.7</span></label>
            <input type="range" id="juliaReal" min="-2" max="2" step="0.01" value="-0.7">
        </div>

        <div class="control-group">
            <label for="juliaImag">Julia Imaginary Part (Im): <span id="val-imag" class="value-display">0.27</span></label>
            <input type="range" id="juliaImag" min="-2" max="2" step="0.01" value="0.27">
        </div>

        <button onclick="resetZoom()">Reset View</button>
        
        <p style="font-size: 0.8rem; color: #666;">
            Math: z = z² + c<br>
            Iterations: 150<br>
            Resolution: High DPI aware
        </p>
    </div>

<script>
/**
 * Configuration & State
 */
const CONFIG = {
    width: 800,
    height: 600,
    maxIterations: 150,
    mandelbrotZoom: 0.002, // Initial zoom level for Mandelbrot
    juliaRe: -0.7,
    juliaIm: 0.27
};

// Canvas Setup (handling High DPI screens)
function setupCanvas(canvasId, width, height) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency
    
    // Calculate actual pixel size based on device pixel ratio
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    
    return ctx;
}

// Initialize
const mandelCtx = setupCanvas('mandelbrotCanvas', CONFIG.width, CONFIG.height);
const juliaCtx = setupCanvas('juliaCanvas', CONFIG.width, CONFIG.height);

/**
 * Math Helpers
 */
function complexMul(a, b) {
    return {
        re: a.re * b.re - a.im * b.im,
        im: a.re * b.im + a.im * b.re
    };
}

function complexAdd(a, b) {
    return {
        re: a.re + b.re,
        im: a.im + b.im
    };
}

/**
 * Rendering Functions
 */

// 1. Mandelbrot Set
function drawMandelbrot() {
    const ctx = mandelCtx;
    const w = CONFIG.width;
    const h = CONFIG.height;
    
    // Map screen coordinates to complex plane
    // Standard range: x [-2, 1], y [-1.5, 1.5]
    const startX = -2;
    const endX = 1;
    const startY = -1.5;
    const endY = 1.5;

    for (let py = 0; py < h; py++) {
        // Optimization: Skip if we are out of bounds visually, but keeping simple loop here
        
        for (let px = 0; px < w; px++) {
            // Calculate complex coordinate c
            const cx = startX + (px / w) * (endX - startX);
            const cy = startY + (py / h) * (endY - startY);

            let zx = 0.0;
            let zy = 0.0;
            let iter = 0;

            // Iteration Loop: z = z^2 + c
            while (zx*zx + zy*zy < 4 && iter < CONFIG.maxIterations) {
                const xtemp = zx * zx - zy * zy + cx;
                zy = 2 * zx * zy + cy;
                zx = xtemp;
                iter++;
            }

            // Coloring
            if (iter === CONFIG.maxIterations) {
                ctx.fillStyle = '#000'; // Inside the set is black
            } else {
                // Smooth coloring approximation using log2 for gradient smoothness
                const smoothVal = Math.log(Math.log(zx*zx + zy*zy)) / Math.log(2);
                const colorIndex = iter + smoothVal; 
                
                // HSL Palette: Blue -> Green -> Yellow -> Red -> Purple
                // Base hue 180 (Cyan) to 360 (Red)
                const hue = ((colorIndex % CONFIG.maxIterations) / CONFIG.maxIterations) * 240 + 180; 
                
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            }

            ctx.fillRect(px, py, 1, 1);
        }
    }
}

// 2. Julia Set
function drawJulia() {
    const ctx = juliaCtx;
    const w = CONFIG.width;
    const h = CONFIG.height;

    // Fixed C for Julia set (defined by sliders)
    const cRe = parseFloat(document.getElementById('juliaReal').value);
    const cIm = parseFloat(document.getElementById('juliaImag').value);

    // Viewport centering around origin (-0.7, 0.27) usually looks best
    const viewX = -0.8; 
    const viewY = -0.5;
    
    for (let py = 0; py < h; py++) {
        for (let px = 0; px < w; px++) {
            // Map screen to complex plane centered at viewX/viewY with zoom
            const zx = (px / w) * CONFIG.width + viewX; 
            const zy = -(py / h) * CONFIG.height + viewY;

            let x = 0.0;
            let y = 0.0;
            let iter = 0;

            while (x*x + y*y < 4 && iter < CONFIG.maxIterations) {
                const xtemp = x*x - y*y + cRe;
                y = 2*x*y + cIm;
                x = xtemp;
                iter++;
            }

            if (iter === CONFIG.maxIterations) {
                ctx.fillStyle = '#000'; // Background black
            } else {
                const hue = ((iter / CONFIG.maxIterations) * 360);
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            }

            ctx.fillRect(px, py, 1, 1);
        }
    }
}

/**
 * UI Logic
 */
const juliaRealInput = document.getElementById('juliaReal');
const juliaImagInput = document.getElementById('juliaImag');
const valRealDisplay = document.getElementById('val-real');
const valImagDisplay = document.getElementById('val-imag');

// Update displays on input
juliaRealInput.addEventListener('input', (e) => {
    CONFIG.juliaRe = parseFloat(e.target.value);
    valRealDisplay.textContent = CONFIG.juliaRe;
});

juliaImagInput.addEventListener('input', (e) => {
    CONFIG.juliaImag = parseFloat(e.target.value);
    valImagDisplay.textContent = CONFIG.juliaImag;
});

function resetZoom() {
    // Reset sliders to default visually and mathematically
    juliaRealInput.value = -0.7;
    juliaImagInput.value = 0.27;
    drawJulia();
}

// Initial Draw
drawMandelbrot();
drawJulia();

/**
 * Resize Handler
 */
window.addEventListener('resize', () => {
    // Re-calculate canvas sizes if window resizes (handled by CSS mostly, but good for safety)
    const mandelCanvas = document.getElementById('mandelbrotCanvas');
    const juliaCanvas = document.getElementById('juliaCanvas');
    
    // Note: In a real app we might want to keep aspect ratio or fill strictly. 
    // Here we just let CSS flexbox handle the visual size, canvas internal resolution stays fixed for math consistency.
});

</script>
</body>
</html>
