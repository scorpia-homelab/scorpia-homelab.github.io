<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>BREAKOUT · Arcade Brick Breaker</title>
<style>
:root{
  --bg:#070b12; --panel:#0d1522; --line:#1e2c3f; --ink:#dbe7f4; --dim:#5b6c82;
  --amber:#ffc857; --coral:#ff5d3a; --mint:#3ee6c1; --sky:#4cc9f0; --pink:#ef5da8;
  --display:Impact,'Haettenschweiler','Arial Black',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:22px 16px 34px;display:flex;justify-content:center;align-items:flex-start;
  color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  background:#070b12;overflow-x:hidden;
}
body::before{content:'';position:fixed;inset:0;z-index:-3;background:
  radial-gradient(900px 520px at 10% -8%,rgba(255,93,58,.16),transparent 62%),
  radial-gradient(1100px 640px at 106% 112%,rgba(62,230,193,.13),transparent 62%),
  linear-gradient(#0b1220,#070b12);animation:drift 26s ease-in-out infinite alternate;}
body::after{content:'';position:fixed;inset:0;z-index:-2;background-image:
  linear-gradient(rgba(148,180,220,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(148,180,220,.05) 1px,transparent 1px);
  background-size:46px 46px;pointer-events:none;}
@keyframes drift{from{background-position:0 0,0 0,0 0}to{background-position:-40px 30px,50px -20px,0 0}}
.cab{width:min(980px,100%);display:flex;flex-direction:column;gap:14px}
.marquee{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.logo{margin:0;font-family:var(--display);font-size:clamp(38px,7vw,66px);letter-spacing:.05em;color:#fff;line-height:1;
  text-shadow:3px 0 rgba(255,93,58,.75),-3px 0 rgba(76,201,240,.75);}
.logo em{font-style:normal;color:var(--amber)}
.tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);border-left:2px solid var(--coral);padding-left:12px}
.hud{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:10px 14px;background:rgba(13,21,34,.72);border:1px solid var(--line);border-radius:10px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat label{font-size:10px;letter-spacing:.24em;color:var(--dim)}
output{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--amber);text-shadow:0 0 9px rgba(255,200,87,.45);line-height:1}
.dots{display:flex;gap:6px;height:20px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:#233043;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
.dot.on{background:var(--mint);box-shadow:0 0 10px rgba(62,230,193,.85)}
#powers{display:flex;gap:6px;margin-left:auto;min-height:20px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid}
.iconbtn{margin-left:6px;background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.15em;padding:7px 10px;border-radius:6px;cursor:pointer;transition:.2s}
.iconbtn:hover{color:var(--amber);border-color:var(--amber)}
.iconbtn.off{text-decoration:line-through;color:#3a4a60}
.stage{position:relative;width:100%;background:#0b121c;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03)}
canvas{display:block;width:100%;height:auto;aspect-ratio:960/640}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 90px rgba(0,0,0,.5)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,14,.78);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.panel{max-width:560px;width:calc(100% - 48px);text-align:center;background:#0d1522f2;border:1px solid rgba(255,200,87,.35);padding:30px 34px;box-shadow:0 0 60px rgba(0,0,0,.6)}
.ov-title{margin:0 0 10px;font-family:var(--display);font-size:clamp(32px,6vw,52px);letter-spacing:.08em;color:#fff;text-shadow:2px 0 rgba(255,93,58,.7),-2px 0 rgba(76,201,240,.7)}
.ov-sub{margin:0 auto 14px;max-width:44ch;font-size:14px;color:var(--ink);line-height:1.5}
.ov-list{list-style:none;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--dim)}
.ov-list b{color:var(--amber)}
.arcbtn{font-family:var(--display);letter-spacing:.14em;font-size:17px;background:var(--coral);color:#20100a;border:none;padding:13px 30px;cursor:pointer;box-shadow:0 5px 0 #8f2c16,0 10px 24px rgba(255,93,58,.35);transition:transform .12s,box-shadow .12s}
.arcbtn:hover{filter:brightness(1.12)}
.arcbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #8f2c16}
.ov-blink{margin:16px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hints{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:12px;color:var(--dim);letter-spacing:.08em;padding:0 4px}
.hints b{color:var(--amber);font-weight:700}
@media (max-width:560px){.tag{display:none}.hud{gap:14px}}
</style>
</head>
<body>
<main class="cab">
  <header class="marquee">
    <h1 class="logo">BREAK<em>OUT</em></h1>
    <div class="tag">Arcade Brick Breaker · Est. 1976</div>
  </header>
  <section class="hud" aria-label="game status">
    <div class="stat"><label for="score">Score</label><output id="score">000000</output></div>
    <div class="stat"><label for="hi">High</label><output id="hi">000000</output></div>
    <div class="stat"><label for="lvl">Level</label><output id="lvl">1/5</output></div>
    <div class="stat"><label>Lives</label><span class="dots" id="lives"></span></div>
    <div id="powers"></div>
    <button id="mute" class="iconbtn" type="button">SOUND ON</button>
  </section>
  <div class="stage" id="stage">
    <canvas id="game" width="960" height="640" role="img" aria-label="Breakout game field"></canvas>
    <div class="scanlines"></div>
    <div class="overlay" id="ovl"></div>
  </div>
  <footer class="hints">
    <span><b>MOVE</b>&nbsp; mouse / ← →</span>
    <span><b>LAUNCH · FIRE</b>&nbsp; space</span>
    <span><b>PAUSE</b>&nbsp; P</span>
    <span><b>SOUND</b>&nbsp; M</span>
  </footer>
</main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const stageEl=document.getElementById('stage'),ovl=document.getElementById('ovl');
const elScore=document.getElementById('score'),elHi=document.getElementById('hi'),elLvl=document.getElementById('lvl'),
      elLives=document.getElementById('lives'),elPowers=document.getElementById('powers'),muteBtn=document.getElementById('mute');

const W=960,H=640;let dpr=1;
function fit(){dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
fit();addEventListener('resize',fit);

const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry32(s){return function(){s|=0;s=s+0x6D217B43|0;let t=Math.imul(s^s>>>15,1|s);t=t+t^t>>>13|0;return((t^t>>>14)>>>0)/4294967296}}
function mix(hex,tgt,t){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,f=(a,c)=>Math.round(a+(c-a)*t);return`rgb(${f(r,tgt[0])},${f(g,tgt[1])},${f(b,tgt[2]))}`}
const lighten=h=>mix(h,[255,255,255],.45),darken=h=>mix(h,[0,0,0],.38);

/* ---------- audio (synthesized) ---------- */
let actx=null,master=null,muted=store.get('bo_mute')==='1';
function ensureAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){actx=new AC();master=actx.createGain();master.gain.value=muted?0:.5;master.connect(actx.destination);}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f,dur,type,vol,slideTo){
  if(!actx||muted)return;const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.02);
}
const SFX={
  paddle:()=>tone(165,.07,'triangle',.3),
  wall:()=>tone(240,.05,'sine',.14),
  brick:c=>tone(300+c*45,.08,'square',.18,300+c*45+140),
  capsule:()=>{tone(520,.09,'triangle',.24);setTimeout(()=>tone(784,.12,'triangle',.24),70)},
  laser:()=>tone(900,.12,'sawtooth',.13,300),
  die:()=>tone(220,.5,'sawtooth',.3,55),
  launch:()=>tone(420,.08,'triangle',.2,640),
  drop:()=>tone(90,.1,'sine',.22),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.22),i*140))
};

/* ---------- constants & state ---------- */
const COLS=10,ROWS=6,MAX_LEVEL=5,BALL_R=7;
const ROW_COLORS=['#ff5d3a','#ffc857','#3ee6c1','#4cc9f0','#ef5da8','#b6f06c'];
const ROW_PTS=[100,90,80,70,60,50];
const PADDLE_H=14,PADDLE_Y=H-34,BASE_W=110,WIDE_W=172;
const CAPS=['E','M','S','L','C'],CAP_COLORS={E:'#3ee6c1',M:'#4cc9f0',S:'#ffc857',L:'#ff5d3a',C:'#ef5da8'};
const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const DISP="Impact,'Haettenschweiler','Arial Black',sans-serif";

let mode='menu',score=0,hi=+(store.get('bo_hi')||0),lives=3,level=1,combo=1;
let paddle={x:W/2,w:BASE_W};
let balls=[],bricks=[],capsules=[],bullets=[],parts=[],pops=[];
let power={expand:false,slow:0,sticky:0,laser:0},timeScale=1,fireT=0;
let shake=0,flash=0,comboPop=0,ptr=W/2;
const keys={
