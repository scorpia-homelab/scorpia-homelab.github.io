<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRICKSTORM · Arcade Brick Breaker</title>
<style>
  :root{
    --bg:#05070f; --panel:#111a30; --panel2:#0b1222; --line:#22304f;
    --gold:#ffd23d; --amber:#ff8a3d; --coral:#ff4d5e; --cyan:#35e0d0;
    --lime:#8be04a; --blue:#5aa0ff; --ink:#04101a; --text:#cfe0ff; --dim:#7d92c0;
    --f-disp:Impact,'Haettenschweiler','Arial Black','Franklin Gothic Medium',sans-serif;
    --f-mono:'Courier New',Courier,ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 700px at 50% -10%, #14264a 0%, transparent 60%),
      radial-gradient(900px 520px at 50% 115%, #0c2a28 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--f-mono);
    overflow-x:hidden;
  }
  /* ---------- ambient starfield ---------- */
  .stars{position:fixed;inset:-70%;pointer-events:none;z-index:0}
  .stars-a{
    background-image:
      radial-gradient(1.5px 1.5px at 30px 40px, rgba(255,255,255,.75), transparent 2.5px),
      radial-gradient(1px 1px at 95px 130px, rgba(255,255,255,.4), transparent 2px),
      radial-gradient(1.2px 1.2px at 165px 70px, rgba(160,215,255,.55), transparent 2px);
    background-size:220px 220px; animation:driftA 180s linear infinite;
  }
  .stars-b{
    background-image:
      radial-gradient(1px 1px at 50px 90px, rgba(255,255,255,.35), transparent 2px),
      radial-gradient(1px 1px at 130px 30px, rgba(255,210,61,.4), transparent 2px);
    background-size:140px 140px; animation:driftB 90s linear infinite;
  }
  @keyframes driftA{to{transform:translate(220px,220px)}}
  @keyframes driftB{to{transform:translate(-140px,140px)}}

  /* ---------- cabinet ---------- */
  .cabinet{
    position:relative; z-index:1; width:min(920px,96vw); margin:26px auto 40px;
    background:linear-gradient(180deg,#1a2340,#0d1426);
    border:1px solid #2a3a66; border-radius:18px; padding:16px 16px 12px;
    box-shadow:0 34px 90px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    user-select:none;
  }
  .screw{position:absolute;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6a7a9a, #22304d 70%);
    box-shadow:inset 0 -1px 2px rgba(0,0,0,.7)}
  .screw::after{content:'';position:absolute;left:2px;right:2px;top:4.5px;height:2px;
    background:rgba(0,0,0,.55);transform:rotate(40deg)}
  .screw.tl{top:9px;left:9px}.screw.tr{top:9px;right:9px}
  .screw.bl{bottom:9px;left:9px}.screw.br{bottom:9px;right:9px}

  /* ---------- marquee ---------- */
  .marquee{
    position:relative; text-align:center; overflow:hidden;
    background:linear-gradient(180deg,#2a1a04,#120b02);
    border:2px solid #3d2a08; border-radius:10px; padding:26px 20px 24px;
    box-shadow:inset 0 0 34px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,220,120,.12);
  }
  .bulbs{position:absolute;left:0;right:0;height:10px;
    background-image:radial-gradient(circle at 5px 5px, #ffe9a0 2px, rgba(255,190,60,.28) 3px, transparent 4.5px);
    background-size:26px 10px; animation:chase 1s steps(2) infinite}
  .bulbs-top{top:5px}.bulbs-bottom{bottom:5px;animation-delay:.5s}
  @keyframes chase{50%{background-position-x:26px}}
  .title{font-family:var(--f-disp);font-size:clamp(34px,7vw,58px);line-height:1;
    letter-spacing:.08em;position:relative;z-index:1}
  .t1{color:#fff;text-shadow:0 0 14px rgba(53,224,208,.85),0 0 34px rgba(53,224,208,.45),3px 3px 0 #0a3a3a}
  .t2{color:var(--gold);text-shadow:0 0 14px rgba(255,210,61,.85),0 0 34px rgba(255,170,43,.5),3px 3px 0 #4a2a00}
  .tagline{font-size:11px;letter-spacing:.42em;color:#c99a3a;margin-top:8px;position:relative;z-index:1}

  /* ---------- screen ---------- */
  .screen-wrap{padding:14px;background:linear-gradient(180deg,#182238,#0c1322);
    border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .screen{position:relative;border-radius:10px;overflow:hidden;background:#04070f;
    box-shadow:inset 0 0 70px rgba(0,0,0,.85), inset 0 0 0 2px #0d1830}
  canvas{display:block;width:100%;height:auto}
  .scanlines{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px)}
  .scanband{position:absolute;left:0;right:0;height:110px;top:-20%;pointer-events:none;
    background:linear-gradient(180deg,transparent, rgba(130,225,255,.055), transparent);
    animation:scan 7s linear infinite}
  @keyframes scan{from{top:-20%}to{top:115%}}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%)}
  .flicker{position:absolute;inset:0;pointer-events:none;background:rgba(160,220,255,.05);
    animation:flick 5s infinite steps(3)}
  @keyframes flick{0%,93%{opacity:0}95%{opacity:1}97%{opacity:.25}100%{opacity:0}}

  /* ---------- HUD ---------- */
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:10px 14px;pointer-events:none}
  .hud-label{display:block;font-size:9px;letter-spacing:.28em;color:#5a7099}
  .hud-score{font-size:22px;font-weight:700;color:var(--gold);text-shadow:0 0 12px rgba(255,210,61,.55)}
  .hud-mid{text-align:center}
  .hud-mid #stage{font-family:var(--f-disp);font-size:24px;color:#fff;letter-spacing:.1em;
    text-shadow:0 0 12px rgba(53,224,208,.6)}
  .hud-mid #stageName{display:block;font-size:10px;letter-spacing:.3em;color:var(--cyan);margin-top:2px}
  .hud-right{text-align:right}
  .hud-hi span:last-child{font-size:15px;font-weight:700;color:#9fb4dd}
  .hud-lives{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}
  .life{width:22px;height:6px;border-radius:3px;background:var(--cyan);box-shadow:0 0 9px rgba(53,224,208,.8)}
  .life.lost{background:#22304d;box-shadow:none}

  .chips{position:absolute;top:58px;left:12px;display:flex;gap:6px;pointer-events:none}
  .chip{position:relative;overflow:hidden;font:700 10px/1 var(--f-mono);padding:5px 9px;
    border-radius:4px;color:var(--ink);letter-spacing:.06em;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .chip .bar{position:absolute;left:0;top:0;bottom:0;width:calc(var(--t,100)*1%);
    background:rgba(255,255,255,.4);transition:width .12s linear}

  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(6,10,22,.55), rgba(4,7,15,.88));
    cursor:pointer;transition:opacity .25s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .ov-box{text-align:center;padding:20px;font-family:var(--f-mono)}
  .ov-credit{font-size:12px;letter-spacing:.4em;color:var(--gold);margin-bottom:14px}
  .ov-kicker{font-size:11px;letter-spacing:.35em;color:#5a7099;margin-bottom:10px}
  .ov-big{font-family:var(--f-disp);font-size:clamp(38px,8vw,58px);letter-spacing:.06em;color:#fff;
    text-shadow:0 0 20px rgba(53,224,208,.65),3px 3px 0 rgba(10,58,58,.8)}
  .ov-big.bad{color:var(--coral);text-shadow:0 0 20px rgba(255,77,94,.65),3px 3px 0 rgba(70,10,20,.8)}
  .ov-big.ok{color:var(--lime);text-shadow:0 0 20px rgba(139,224,74,.65),3px 3px 0 rgba(30,60,10,.8)}
  .ov-sub{font-size:12px;margin-top:14px;color:#9fb4dd;letter-spacing:.12em}
  .ov-hint{font-size:13px;margin-top:20px;color:var(--gold);letter-spacing:.18em}
  .ov-hi{font-size:12px;margin-top:14px;color:#5a7099;letter-spacing:.2em}
  .ov-hi span{color:var(--gold)}
  .ov-new{color:var(--gold);font-size:15px;margin-top:10px;letter-spacing:.25em}
  .blink{animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}

  /* ---------- control deck ---------- */
  .deck{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 6px 6px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;letter-spacing:.12em;color:var(--dim)}
  kbd{font:700 10px var(--f-mono);background:#1a2440;border:1px solid #2e3f6e;border-bottom-width:3px;
    border-radius:4px;padding:2px 6px;color:#cfe0ff;margin:0 2px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font:700 10px var(--f-mono);padding:4px 9px;border-radius:99px;color:var(--ink);
    background:var(--c,#888);letter-spacing:.05em;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .buttons{display:flex;gap:10px}
  .btn{font:700 13px var(--f-mono);letter-spacing:.14em;padding:11px 20px;border-radius:8px;
    border:1px solid #2e3f6e;background:#1a2440;color:#cfe0ff;cursor:pointer;
    box-shadow:0 4px 0 #0a1122, 0 10px 18px rgba(0,0,0,.4);
    transition:transform .06s, box-shadow .06s, filter .15s}
  .btn:hover{filter:brightness(1.2)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1122}
  .btn-gold{background:linear-gradient(180deg,#ffe066,#ffb347);color:#3a2400;border-color:#8a5a00;
    box-shadow:0 4px 0 #7a4a00, 0 12px 26px rgba(255,170,43,.28)}
  .btn-gold:active{box-shadow:0 1px 0 #7a4a00}
  .foot{text-align:center;font-size:10px;letter-spacing:.3em;color:#41527a;padding:10px 0 4px}

  @media (max-width:600px){
    .hud-score{font-size:16px}.hud-mid #stage{font-size:18px}
    .legend{font-size:9px;gap:10px}
    .deck{justify-content:center}
  }
  @media (prefers-reduced-motion: reduce){
    .stars,.scanband,.bulbs,.flicker,.blink{animation:none}
  }
</style>
</head>
<body>
<div class="stars stars-a"></div>
<div class="stars stars-b"></div>

<main class="cabinet">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <header class="marquee">
    <div class="bulbs bulbs-top"></div>
    <h1 class="title"><span class="t1">BRICK</span><span class="t2">STORM</span></h1>
    <p class="tagline">ARCADE BRICK BREAKER · EST. 198X</p>
    <div class="bulbs bulbs-bottom"></div>
  </header>

  <section class="screen-wrap">
    <div class="screen">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="scanlines"></div>
      <div class="scanband"></div>
      <div class="vignette"></div>
      <div class="flicker"></div>

      <div class="hud">
        <div class="hud-left"><span class="hud-label">SCORE</span><span class="hud-score" id="score">000000</span></div>
        <div class="hud-mid"><span class="hud-label">STAGE</span><span id="stage">1</span><span id="stageName">FIRST LIGHT</span></div>
        <div class="hud-right">
          <div class="hud-hi"><span class="hud-label">HI-SCORE</span><span id="hiscore">000000</span></div>
          <div class="hud-lives" id="lives"></div>
        </div>
      </div>

      <div class="chips" id="chips"></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </section>

  <section class="deck">
    <div class="legend">
      <span><kbd>MOUSE</kbd>/<kbd>←</kbd><kbd>→</kbd> MOVE</span>
      <span><kbd>SPACE</kbd>/<kbd>CLICK</kbd> LAUNCH</span>
      <span><kbd>P</kbd> PAUSE</span>
    </div>
    <div class="pills">
      <span class="pill" style="--c:#8be04a">W · WIDE</span>
      <span class="pill" style="--c:#35e0d0">M · MULTI</span>
      <span class="pill" style="--c:#5aa0ff">S · SLOW</span>
      <span class="pill" style="--c:#ff4d5e">L · LASER</span>
      <span class="pill" style="--c:#e8ecf5">H · SHIELD</span>
    </div>
    <div class="buttons">
      <button id="btnMain" class="btn btn-gold">START GAME</button>
      <button id="btnSound" class="btn">SOUND: ON</button>
    </div>
  </section>

  <footer class="foot">© 198X BRICKSTORM AMUSEMENT CO. — NO QUARTERS REQUIRED</footer>
</main>

<noscript><p style="text-align:center;color:#ff4d5e">JavaScript is required to play.</p></noscript>

<script>
(() => {
'use strict';
/* ============================== SETUP ============================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;

const el = id => document.getElementById(id);
const scoreEl = el('score'), hiEl = el('hiscore'), stageEl = el('stage'),
      stageNameEl = el('stageName'), livesEl = el('lives'), chipsEl = el('chips'),
      overlayEl = el('overlay'), btnMain = el('btnMain'), btnSound = el('btnSound');

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(Math.max(0, Math.floor(n))).padStart(6, '0');

/* ============================== AUDIO ============================== */
let audio = null, muted = localStorage.getItem('brickstorm_mute') === '1';
function ac(){
  if(!audio){ try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(audio && audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(f, dur, type='square', vol=0.15, slide=0){
  if(muted) return; const a = ac(); if(!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  paddle(){ tone(180, .08, 'square', .18, 120); },
  wall(){ tone(320, .05, 'triangle', .1); },
  thud(){ tone(160, .05, 'triangle', .09); },
  brick(c){ tone(420 + Math.min(10, c) * 45, .09, 'square', .16, 200); },
  core(){ tone(90, .25, 'sawtooth', .2, -40); tone(180, .2, 'square', .1); },
  power(){ [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.13), i*70)); },
  laser(){ tone(1200, .12, 'sawtooth', .07, -800); },
  shield(){ tone(240, .15, 'triangle', .18, -100); },
  lose(){ [330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.15), i*110)); },
  clear(){ [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'square',.14), i*90)); },
  over(){ [392,330,262,196,131,98].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.13), i*140)); },
  start(){ [262,392,523,784].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.13), i*80)); },
};

/* ============================== LEVELS ============================== */
const LAYOUTS = [
  { name:'FIRST LIGHT', rows:[
    '111111111111','111111111111','222222222222','222222222222','333333333333' ]},
  { name:'CHECKER', rows:[
    '1.2.3.4.3.2.1.','1.2.3.4.3.2.1.','2.3.4.1.1.4.3.','2.3.4.1.1.4.3.','3.4.1.2.2.1.4.','4.1.2.3.3.2.1.' ]},
  { name:'PYRAMID', rows:[
    '......C......','.....333.....','....3443....','...34CC43...','...34CC43...','....3443....','.....333.....' ]},
  { name:'FORTRESS', rows:[
    '444444444444','4..........4','4.33333333.4','4.3.CC.C.3.4','4.33333333.4','4..........4','444444444444' ]},
  { name:'GAUNTLET', rows:[
    '432112344321','432112344321','C.C.C.C.C.C.','432112344321','432112344321' ]},
];
const COLS = 12, GAP = 6, BRICK_TOP = 84, BRICK_H = 20;
const BRICK_W = (W - (COLS + 1) * GAP) / COLS;
const TIER_COLORS = {1:'#ff4d5e', 2:'#ff8a3d', 3:'#ffd23d', 4:'#8be04a'};
const POWERUPS = {
  wide:  {c:'#8be04a', label:'W', name:'WIDE PADDLE'},
  multi: {c:'#35e0d0', label:'M', name:'MULTI-BALL'},
  slow:  {c:'#5aa0ff', label:'S', name:'SLOW-MO'},
  laser: {c:'#ff4d5e', label:'L', name:'LASERS'},
  shield:{c:'#e8ecf5', label:'H', name:'SHIELD'},
};
const CHIP_MAX = {wide:12, slow:8, laser:10};

/* ============================== STATE ============================== */
let state = 'start';
let score = 0, hi = +(localStorage.getItem('brickstorm_hi') || 0);
let lives = 3, level = 1, combo = 0, comboMult = 1, bricksBroken = 0;
let paddle, balls = [], bricks = [], powerups = [], lasers = [],
    particles = [], popups = [], shield = 0;
let effects = {wide:0, slow:0, laser:0};
let shake = 0, flash = 0, time = 0, laserTimer = 0, clearTimer = 0;
let demo = null;
const keys = {};

function buildLevel(n, announce){
  const L = LAYOUTS[(n - 1) % LAYOUTS.length];
  const rep = Math.floor((n - 1) / LAYOUTS.length);
  stageNameEl.textContent = L.name + (rep ? ' ' + ['II','III','IV','V','VI'][Math.min(rep-1,5)] : '');
  bricks = [];
  L.rows.forEach((row, r) => {
    for(let c = 0; c < COLS; c++){
      const ch = row[c] || '.';
      if(ch === '.') continue;
      bricks.push({
        x: GAP + c * (BRICK_W + GAP), y: BRICK_TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H,
        hp: ch === 'C' ? 3 : +ch, maxHp: ch === 'C' ? 3 : +ch,
        core: ch === 'C', flash: 0, alive: true,
        born: time + r * 0.05 + c * 0.008
      });
    }
  });
  bricksBroken = 0;
  if(announce) popups.push(mkPopup(W/2, 300, 'STAGE ' + n + ' · ' + stageNameEl.textContent, '#ffd23d', 20, 2.2));
}
function spawnBall(stuck = true){
  balls.push({x: paddle.x, y: paddle.y - 14, vx:0, vy:0, r:7, stuck, trail:[]});
}
function baseSpeed(){
  const s = Math.min(560, 300 + (level - 1) * 22 + Math.min(140, bricksBroken * 1.1));
  return s * (effects.slow > 0 ? 0.62 : 1);
}

/* ============================== FLOW ============================== */
function startGame(){
  score = 0; lives = 3; level = 1; combo = 0; comboMult = 1;
  effects = {wide:0, slow:0, laser:0}; shield = 0;
  powerups = []; lasers = []; particles = []; popups = [];
  paddle = {x: W/2, y: H - 40, w: 110, mouseX: null, pulse: 0};
  buildLevel(1, true);
  balls = []; spawnBall();
  state = 'play'; showOverlay(null);
  btnMain.textContent = 'PAUSE';
  updateHUD(); sfx.start();
}
function nextLevel(){
  level++; combo = 0; comboMult = 1;
  effects = {wide:0, slow:0, laser:0}; shield = 0;
  powerups = []; lasers = [];
  buildLevel(level, true);
  balls = []; spawnBall();
  state = 'play'; showOverlay(null);
  btnMain.textContent = 'PAUSE';
  updateHUD();
}
function levelClear(){
  const bonus = 250 * level;
  score += bonus;
  if(score > hi){ hi = score; localStorage.setItem('brickstorm_hi', hi); }
  state = 'clear'; clearTimer = 4;
  sfx.clear();
  btnMain.textContent = 'NEXT STAGE';
  showOverlay(`<div class="ov-box">
    <div class="ov-kicker">STAGE ${level} CLEAR</div>
    <div class="ov-big ok">STAGE CLEAR!</div>
    <div class="ov-sub">BONUS +${bonus}</div>
    <div class="ov-hint blink">NEXT: ${LAYOUTS[level % LAYOUTS.length].name} — PRESS ENTER</div>
  </div>`);
  updateHUD();
}
function loseLife(){
  lives--; combo = 0; comboMult = 1;
  shake = REDUCED ? 0 : 14; flash = 1;
  sfx.lose();
  if(lives <= 0){ gameOver(); return; }
  effects = {wide:0, slow:0, laser:0}; shield = 0;
  powerups = []; lasers = []; paddle.w = 110;
  balls = []; spawnBall();
  updateHUD();
}
function gameOver(){
  state = 'over';
  const isHi = score > hi;
  if(isHi){ hi = score; localStorage.setItem('brickstorm_hi', hi); }
  sfx.over();
  btnMain.textContent = 'PLAY AGAIN';
  showOverlay(`<div class="ov-box">
    <div class="ov-big bad">GAME OVER</div>
    <div class="ov-sub">FINAL SCORE ${pad(score)}</div>
    ${isHi ? '<div class="ov-new blink">★ NEW HIGH SCORE ★</div>' : ''}
    <div class="ov-hint blink">PRESS ENTER OR CLICK TO PLAY AGAIN</div>
  </div>`);
  updateHUD();
}
function togglePause(){
  if(state === 'play'){
    state = 'pause'; btnMain.textContent = 'RESUME';
    showOverlay(`<div class="ov-box">
      <div class="ov-big">PAUSED</div>
      <div class="ov-hint blink">PRESS P OR ENTER TO RESUME</div>
    </div>`);
  } else if(state === 'pause'){
    state = 'play'; btnMain.textContent = 'PAUSE'; showOverlay(null);
  }
}
function showOverlay(html){
  if(html == null){ overlayEl.classList.add('hidden'); overlayEl.innerHTML = ''; }
  else { overlayEl.innerHTML = html; overlayEl.classList.remove('hidden'); }
}
function startOverlayHTML(){
  return `<div class="ov-box">
    <div class="ov-credit blink">● CREDIT 1 ●</div>
    <div class="ov-big">READY?</div>
    <div class="ov-sub">SMASH EVERY BRICK · CATCH POWER-UPS · DON'T DROP THE BALL</div>
    <div class="ov-hint blink">PRESS START OR HIT ENTER</div>
    <div class="ov-hi">HI-SCORE <span>${pad(hi)}</span></div>
  </div>`;
}

/* ============================== INPUT ============================== */
function canvasX(clientX){
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
function launchAll(){
  let launched = false;
  balls.forEach(b => {
    if(b.stuck){
      b.stuck = false;
      const a = Math.random() * 0.6 - 0.3, s = baseSpeed();
      b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a);
      launched = true;
    }
  });
  if(launched) sfx.paddle();
}
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.code)) e.preventDefault();
  if((e.code === 'Enter' || e.code === ' ') && document.activeElement &&
     document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  keys[e.code] = true;
  if(e.code === 'Enter' || e.code === ' '){
    if(state === 'start' || state === 'over'){ ac(); startGame(); }
    else if(state === 'clear'){ ac(); nextLevel(); }
    else if(state === 'pause' && e.code === 'Enter'){ togglePause(); }
    else if(state === 'play' && e.code === ' '){ ac(); launchAll(); }
  }
  if(e.code === 'KeyP' || e.code === 'Escape'){
    if(state === 'play' || state === 'pause') togglePause();
  }
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { if(state === 'play') togglePause(); });

canvas.addEventListener('mousemove', e => { if(paddle) paddle.mouseX = canvasX(e.clientX); });
canvas.addEventListener('mousedown', () => { ac(); if(state === 'play') launchAll(); });
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); ac();
  if(state === 'play') launchAll();
  else if(state === 'start' || state === 'over') startGame();
  else if(state === 'clear') nextLevel();
  else if(state === 'pause') togglePause();
  if(paddle) paddle.mouseX = canvasX(e.touches[0].clientX);
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(paddle) paddle.mouseX = canvasX(e.touches[0].clientX);
}, {passive:false});

overlayEl.addEventListener('click', () => {
  ac();
  if(state === 'start' || state === 'over') startGame();
  else if(state === 'clear') nextLevel();
  else if(state === 'pause') togglePause();
});
btnMain.addEventListener('click', e => {
  ac(); e.currentTarget.blur();
  if(state === 'start' || state === 'over') startGame();
  else if(state === 'play' || state === 'pause') togglePause();
  else if(state === 'clear') nextLevel();
});

  if(!muted) tone(660, .08, 'square', .1);

btnSound.textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');

/* ============================== UPDATE ============================== */
function updatePaddle(dt){
  const speed = 640;
  const kL = keys.ArrowLeft || keys.KeyA, kR = keys.ArrowRight || keys.KeyD;
  if(kL) paddle.x -= speed * dt;
  if(kR) paddle.x += speed * dt;
  if(paddle.mouseX != null && !kL && !kR){
    paddle.x += (paddle.mouseX - paddle.x) * Math.min(1, dt * 14);
  }
  const half = paddle.w / 2;
  paddle.x = Math.max(half, Math.min(W - half, paddle.x));
  const targetW = effects.wide > 0 ? 165 : 110;
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 8);
  paddle.pulse = Math.max(0, (paddle.pulse || 0) - dt * 4);
}
function hitBricks(b){
  for(const br of bricks){
    if(!br.alive) continue;
    if(b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
       b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
    const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
    const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
    if(ox < oy) b.vx = (b.x < br.x + br.w/2) ? -Math.abs(b.vx) : Math.abs(b.vx);
    else        b.vy = (b.y < br.y + br.h/2) ? -Math.abs(b.vy) : Math.abs(b.vy);
    damageBrick(br, 1);
    break;
  }
}
function damageBrick(br, dmg){
  br.hp -= dmg; br.flash = 1;
  if(br.hp > 0){ sfx.thud(); return; }
  br.alive = false;
  bricksBroken++;
  combo++;
  const newMult = 1 + Math.min(4, Math.floor(combo / 4));
  if(newMult > comboMult){
    comboMult = newMult;
    popups.push(mkPopup(br.x + br.w/2, br.y - 6, 'COMBO ×' + newMult, '#ffd23d', 16));
  }
  const base = br.core ? 500 : [0,50,100,150,200][br.maxHp];
  const pts = base * comboMult;
  score += pts;
  if(score > hi){ hi = score; localStorage.setItem('brickstorm_hi', hi); }
  const cx = br.x + br.w/2, cy = br.y + br.h/2;
  popups.push(mkPopup(cx, br.y + 8, '+' + pts, br.core ? '#ffffff' : TIER_COLORS[br.maxHp], 13));
  burst(cx, cy, br.core ? '#ffffff' : TIER_COLORS[br.maxHp], br.core ? 22 : 12);
  shake = Math.max(shake, REDUCED ? 0 : (br.core ? 9 : 3));
  if(br.core) sfx.core(); else sfx.brick(combo);
  if(Math.random() < (br.core ? 0.9 : 0.16)) dropPowerup(cx, cy);
  updateHUD();
}
function updateBalls(dt){
  const sp = baseSpeed();
  for(let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    if(b.stuck){ b.x = paddle.x; b.y = paddle.y - 14; continue; }
    const cur = Math.hypot(b.vx, b.vy) || 1;
    const k = 1 + (sp / cur - 1) * Math.min(1, dt * 3);
    b.vx *= k; b.vy *= k;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > 10) b.trail.shift();
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
    if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); sfx.wall(); }
    if(shield > 0 && b.vy > 0 && b.y + b.r >= H - 10){
      b.y = H - 10 - b.r; b.vy = -Math.abs(b.vy);
      shield--; sfx.shield(); shake = Math.max(shake, REDUCED ? 0 : 4);
      if(shield <= 0) popups.push(mkPopup(W/2, H - 40, 'SHIELD DOWN', '#e8ecf5', 14));
    }
    if(b.y > H + 30){ balls.splice(i, 1); continue; }
    if(b.vy > 0 && b.y + b.r >= paddle.y - 8 && b.y < paddle.y + 16 &&
       Math.abs(b.x - paddle.x) <= paddle.w/2 + b.r){
      const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w/2)));
      const ang = rel * 1.05, s = baseSpeed();
      b.vx = s * Math.sin(ang); b.vy = -s * Math.cos(ang);
      b.y = paddle.y - 8 - b.r;
      paddle.pulse = 1;
      if(combo > 0){ combo = 0; comboMult = 1; }
      sfx.paddle();
      burst(b.x, paddle.y - 6, '#35e0d0', 5);
    }
    if(b.y - b.r < BRICK_TOP + 220) hitBricks(b);
  }
  if(state === 'play' && balls.length === 0) loseLife();
}
function dropPowerup(x, y){
  const r = Math.random();
  const type = r < .25 ? 'wide' : r < .45 ? 'multi' : r < .65 ? 'slow' : r < .85 ? 'laser' : 'shield';
  powerups.push({x, y, vy: 90, type, spin: Math.random() * 6});
}
function applyPowerup(t){
  const P = POWERUPS[t];
  score += 100;
  if(score > hi){ hi = score; localStorage.setItem('brickstorm_hi', hi); }
  popups.push(mkPopup(paddle.x, paddle.y - 26, P.name, P.c, 15));
  sfx.power();
  if(t === 'wide') effects.wide = CHIP_MAX.wide;
  if(t === 'slow') effects.slow = CHIP_MAX.slow;
  if(t === 'laser'){ effects.laser = CHIP_MAX.laser; laserTimer = 0; }
  if(t === 'shield') shield = 1;
  if(t === 'multi'){
    if(!balls.some(b => !b.stuck)) launchAll();
    balls.filter(b => !b.stuck).forEach(b => {
      for(let k = 0; k < 2 && balls.length < 6; k++){
        const a = Math.random() * 1.2 - 0.6, s = baseSpeed();
        balls.push({x:b.x, y:b.y, vx:s*Math.sin(a), vy:-s*Math.cos(a), r:7, stuck:false, trail:[]});
      }
    });
  }
  updateHUD();
}
function updatePowerups(dt){
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.y += p.vy * dt; p.spin += dt * 4;
    if(p.y > H + 20){ powerups.splice(i, 1); continue; }
    if(p.y + 10 >= paddle.y - 8 && p.y < paddle.y + 16 &&
       Math.abs(p.x - paddle.x) <= paddle.w/2 + 12){
      powerups.splice(i, 1);
      applyPowerup(p.type);
    }
  }
}
function updateLasers(dt){
  if(effects.laser > 0){
    laserTimer -= dt;
    if(laserTimer <= 0){
      laserTimer = 0.45;
      lasers.push({x: paddle.x - paddle.w/2 + 8, y: paddle.y - 10},
                  {x: paddle.x + paddle.w/2 - 8, y: paddle.y - 10});
      sfx.laser();
    }
  }
  for(let i = lasers.length - 1; i >= 0; i--){
    const l = lasers[i];
    l.y -= 700 * dt;
    if(l.y < -10){ lasers.splice(i, 1); continue; }
    for(const br of bricks){
      if(!br.alive) continue;
      if(l.x > br.x - 2 && l.x < br.x + br.w + 2 && l.y < br.y + br.h && l.y > br.y - 10){
        lasers.splice(i, 1);
        damageBrick(br, 1);
        break;
      }
    }
  }
}
function tickEffects(dt){
  for(const k in effects) if(effects[k] > 0) effects[k] = Math.max(0, effects[k] - dt);
}
function burst(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 60,
      life: .5 + Math.random()*.5, max: 1, color, size: 2 + Math.random()*3});
  }
  if(particles.length > 400) particles.splice(0, particles.length - 400);
}
function mkPopup(x, y, text, color, size, life){
  const l = life || 1.1;
  return {x, y, text, color, size: size || 12, life: l, max: l};
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 400 * dt; p.vx *= 0.99;
  }
}
function updatePopups(dt){
  for(let i = popups.length - 1; i >= 0; i--){
    const p = popups[i];
    p.life -= dt; p.y -= 30 * dt;
    if(p.life <= 0) popups.splice(i, 1);
  }
}
/* attract-mode demo ball */
function initDemo(){
  buildLevel(1, false);
  demo = {x: W/2, y: 320, vx: 190, vy: 150, r: 7, trail: []};
}
function updateDemo(dt){
  const d = demo;
  d.x += d.vx * dt; d.y += d.vy * dt;
  if(d.x < d.r){ d.x = d.r; d.vx = Math.abs(d.vx); }
  if(d.x > W - d.r){ d.x = W - d.r; d.vx = -Math.abs(d.vx); }
  if(d.y < d.r){ d.y = d.r; d.vy = Math.abs(d.vy); }
  if(d.y > H - d.r){ d.y = H - d.r; d.vy = -Math.abs(d.vy); }
  for(const br of bricks){
    if(!br.alive) continue;
    if(d.x + d.r < br.x || d.x - d.r > br.x + br.w ||
       d.y + d.r < br.y || d.y - d.r > br.y + br.h) continue;
    const ox = Math.min(d.x + d.r - br.x, br.x + br.w - (d.x - d.r));
    const oy = Math.min(d.y + d.r - br.y, br.y + br.h - (d.y - d.r));
    if(ox < oy) d.vx = (d.x < br.x + br.w/2) ? -Math.abs(d.vx) : Math.abs(d.vx);
    else        d.vy = (d.y < br.y + br.h/2) ? -Math.abs(d.vy) : Math.abs(d.vy);
  }
  d.trail.push({x:d.x, y:d.y});
  if(d.trail.length > 12) d.trail.shift();
}

/* ============================== HUD / CHIPS ============================== */
const hudCache = {};
function updateHUD(){
  const s = pad(score);
  if(hudCache.s !== s){ hudCache.s = s; scoreEl.textContent = s; }
  const h = pad(hi);
  if(hudCache.h !== h){ hudCache.h = h; hiEl.textContent = h; }
  if(hudCache.l !== level){ hudCache.l = level; stageEl.textContent = level; }
  if(hudCache.lv !== lives){ hudCache.lv = lives;
    livesEl.innerHTML = [0,1,2].map(i => `<span class="life${i < lives ? '' : ' lost'}"></span>`).join('');
  }
}
let chipsSig = null;
function updateChips(){
  const active = Object.keys(effects).filter(k => effects[k] > 0);
  const sig = active.join(',');
  if(sig !== chipsSig){
    chipsSig = sig;
    chipsEl.innerHTML = active.map(k =>
      `<span class="chip" data-k="${k}" style="background:${POWERUPS[k].c}">${POWERUPS[k].label} ${POWERUPS[k].name}<span class="bar"></span></span>`
    ).join('');
  }
  chipsEl.querySelectorAll('.chip').forEach(ch => {
    const k = ch.dataset.k;
    ch.style.setProperty('--t', Math.max(0, effects[k] / CHIP_MAX[k] * 100));
  });
}

/* ============================== RENDER ============================== */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBricks(){
  for(const br of bricks){
    if(!br.alive) continue;
    const s = Math.max(0, Math.min(1, (time - br.born) / 0.35));
    if(s <= 0) continue;
    const c = br.core ? '#dff1ff' : TIER_COLORS[br.maxHp];
    const yy = br.y + (1 - s) * -14;
    ctx.globalAlpha = s;
    ctx.fillStyle = c;
    roundRect(br.x, yy, br.w, br.h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(br.x + 3, yy + 2, br.w - 6, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(br.x + 2, yy + br.h - 4, br.w - 4, 3);
    if(br.hp < br.maxHp){
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(br.x + br.w*0.3, yy + 2);
      ctx.lineTo(br.x + br.w*0.45, yy + br.h*0.5);
      ctx.lineTo(br.x + br.w*0.3, yy + br.h - 2);
      if(br.maxHp - br.hp > 1){
        ctx.moveTo(br.x + br.w*0.7, yy + 2);
        ctx.lineTo(br.x + br.w*0.55, yy + br.h*0.55);
        ctx.lineTo(br.x + br.w*0.75, yy + br.h - 2);
      }
      ctx.stroke();
    }
    if(br.core){
      const p = 0.5 + 0.5 * Math.sin(time * 4 + br.x * 0.05);
      ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.4 * p})`;
      ctx.lineWidth = 2;
      roundRect(br.x - 2, yy - 2, br.w + 4, br.h + 4, 6); ctx.stroke();
    }
    if(br.flash > 0){
      ctx.fillStyle = `rgba(255,255,255,${br.flash * 0.7})`;
      roundRect(br.x, yy, br.w, br.h, 4); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
function drawPaddle(){
  const pw = paddle.w * (1 + (paddle.pulse || 0) * 0.08);
  const x = paddle.x - pw/2, y = paddle.y - 7, h = 14;
  const wide = effects.wide > 0;
  ctx.save();
  ctx.shadowColor = wide ? '#8be04a' : '#35e0d0';
  ctx.shadowBlur = 18 + (paddle.pulse || 0) * 14;
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, wide ? '#c8ff8a' : '#a5f5ea');
  grad.addColorStop(0.5, wide ? '#8be04a' : '#35e0d0');
  grad.addColorStop(1, wide ? '#4a8a1a' : '#1a7a6e');
  ctx.fillStyle = grad;
  roundRect(x, y, pw, h, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRect(x + 3, y + 2, 6, 4, 2); ctx.fill();
  roundRect(x + pw - 9, y + 2, 6, 4, 2); ctx.fill();
}
function drawBall(b){
  for(let i = 0; i < b.trail.length; i++){
    const t = b.trail[i], a = (i + 1) / b.trail.length;
    ctx.fillStyle = `rgba(53,224,208,${a * 0.25})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, b.r * a, 0, 7); ctx.fill();
  }
  ctx.save();
  ctx.shadowColor = '#35e0d0'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBalls(){ for(const b of balls) drawBall(b); }
function drawPowerups(){
  for(const p of powerups){
    const P = POWERUPS[p.type];
    const pulse = 0.6 + 0.4 * Math.sin(p.spin * 2);
    ctx.save();
    ctx.shadowColor = P.c; ctx.shadowBlur = 10 + 8 * pulse;
    ctx.fillStyle = P.c;
    roundRect(p.x - 15, p.y - 8, 30, 16, 8); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#04101a';
    ctx.font = '700 11px "Courier New",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(P.label, p.x, p.y + 1);
  }
}
function drawLasers(){
  for(const l of lasers){
    ctx.save();
    ctx.shadowColor = '#ff4d5e'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff8a9a';
    ctx.fillRect(l.x - 2, l.y - 14, 4, 16);
    ctx.restore();
  }
}
function drawShield(){
  if(shield <= 0) return;
  const a = 0.5 + 0.3 * Math.sin(time * 6);
  ctx.save();
  ctx.shadowColor = '#e8ecf5'; ctx.shadowBlur = 16;
  ctx.fillStyle = `rgba(220,240,255,${0.5 + 0.3 * a})`;
  ctx.fillRect(0, H - 8, W, 5);
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawPopups(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
  for(const p of popups){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.font = `700 ${p.size}px "Courier New",monospace`;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#060a14'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,140,255,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x = 40; x < W; x += 40){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for(let y = 40; y < H; y += 40){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const g = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, 420);
  g.addColorStop(0, 'rgba(53,224,208,0.10)'); g.addColorStop(1, 'rgba(53,224,208,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 300);

  if(flash > 0){
    ctx.fillStyle = `rgba(255,60,80,${flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
  if(shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBricks();
  drawShield();
  drawPowerups();
  drawLasers();
  if(paddle && state !== 'start') drawPaddle();
  if(state === 'start' && demo) drawBall(demo);
  else drawBalls();
  drawParticles();
  drawPopups();
}

/* ============================== MAIN LOOP ============================== */
let last = performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t; time += dt;

  if(state === 'play'){
    updatePaddle(dt);
    updateBalls(dt);
    updatePowerups(dt);
    updateLasers(dt);
    tickEffects(dt);
    if(state === 'play' && bricks.every(b => !b.alive)) levelClear();
  } else if(state === 'start'){
    updateDemo(dt);
  } else if(state === 'clear'){
    clearTimer -= dt;
    if(clearTimer <= 0) nextLevel();
  }
  if(state !== 'pause'){
    updateParticles(dt);
    updatePopups(dt);
    for(const br of bricks) if(br.flash > 0) br.flash -= dt * 5;
    shake = Math.max(0, shake - shake * 6 * dt - 2 * dt);
    flash = Math.max(0, flash - dt * 1.6);
  }
  updateHUD();
  updateChips();
  const want = state === 'play' ? 'none' : 'default';
  if(canvas.style.cursor !== want) canvas.style.cursor = want;
  render();
}

paddle = {x: W/2, y: H - 40, w: 110, mouseX: null, pulse: 0};
initDemo();
updateHUD();
showOverlay(startOverlayHTML());
requestAnimationFrame(frame);
})();
