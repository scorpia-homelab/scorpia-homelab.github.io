<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELTA — C64 Space Shooter</title>
<style>
:root{
  --bg:#0a0d16; --text:#c8d0e0; --dim:#79839a;
  --cyan:#00ffff; --yellow:#ffd75e;
  --bezel-hi:#e6dab8; --bezel-lo:#b3a37e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;
  min-height:100vh; overflow-x:hidden;
}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 50% at 50% 0%, rgba(45,75,150,.14), transparent 60%),
    radial-gradient(ellipse 120% 60% at 50% 115%, rgba(0,0,0,.6), transparent 70%);
}
body::before,body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;}
body::before{
  background-image:
    radial-gradient(1px 1px at 22px 34px, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 121px 88px, rgba(255,255,255,.32) 50%, transparent 51%),
    radial-gradient(1px 1px at 199px 156px, rgba(255,255,255,.42) 50%, transparent 51%),
    radial-gradient(1px 1px at 64px 198px, rgba(255,255,255,.28) 50%, transparent 51%),
    radial-gradient(1px 1px at 168px 231px, rgba(255,255,255,.38) 50%, transparent 51%);
  background-size:260px 260px; animation:drift 260s linear infinite;
}
body::after{
  background-image:
    radial-gradient(2px 2px at 84px 58px, rgba(130,200,255,.22) 50%, transparent 51%),
    radial-gradient(2px 2px at 302px 208px, rgba(255,255,255,.16) 50%, transparent 51%),
    radial-gradient(2px 2px at 428px 342px, rgba(130,200,255,.14) 50%, transparent 51%),
    radial-gradient(1px 1px at 244px 122px, rgba(255,255,255,.2) 50%, transparent 51%);
  background-size:520px 520px; animation:drift2 400s linear infinite;
}
@keyframes drift{to{background-position:-260px 0}}
@keyframes drift2{to{background-position:-520px 0}}

.wrap{position:relative;z-index:1;max-widthpx;margin:0 auto;padding:26px 16px 42px;display:flex;flex-direction:column;gap:16px;}
.insert-line{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;letter-spacing:3px;padding-left:6px;}
.insert-line .blk{color:var(--yellow);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}

/* cartridge */
.cart{display:flex;align-items:stretch;background:linear-gradient(#26262c,#141419);border:1px solid #000;border-radius:10px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.09);}
.cart-ridges{width:52px;border-radius:5px;margin-right:10px;background:repeating-linear-gradient(90deg,#0d0d11 0 5px,#232329 5px 11px);box-shadow:inset 0 0 8px rgba(0,0,0,.6);}
.cart-label{flex:1;display:flex;align-items:center;gap:18px;background:linear-gradient(#efe4c2,#d5c9a2);border-radius:5px;padding:10px 18px;box-shadow:inset 0 0 22px rgba(120,90,40,.28), inset 0 1px 0 rgba(255,255,255,.5);}
#logoCanvas{image-rendering:pixelated;display:block;}
.cart-meta{font-size:11px;line-height:1.6;letter-spacing:1px;color:#4a3a20;}
.cart-meta b{display:block;font-size:13px;letter-spacing:4px;color:#2a2014;}
.cart-badge{width:56px;margin-left:10px;border-radius:5px;background:linear-gradient(#6b4a2f,#43301c);color:#efe4c2;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.4);}

/* monitor */
.monitor{width:100%;max-widthpx;margin:0 auto;background:linear-gradient(180deg,var(--bezel-hi),#cfc29c 55%,var(--bezel-lo));border-radius:26px;padding:26px 26px 16px;box-shadow:0 30px 70px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -10px 20px rgba(60,40,10,.35);}
.screen{position:relative;background:#0a0a0a;border-radius:14px;padding:12px;box-shadow:inset 0 0 34px rgba(0,0,0,.95), 0 0 0 4px #232323, 0 0 46px rgba(0,255,255,.06);}
.crt{position:relative;margin:0 auto;width:max-content;animation:crtOn .9s cubic-bezier(.2,.8,.25,1) both;}
@keyframes crtOn{0%{transform:scale(.002,.004);filter:brightness(7)}55%{transform:scale(1.03,.012);filter:brightness(4)}78%{transform:scale(1,1);filter:brightness(1.5)}100%{transform:scale(1,1);filter:brightness(1)}}
#game{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0px, rgba(0,0,0,.24) 1px, transparent 1px, transparent 3px);}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 30%, transparent 46%);}
.bezel{display:flex;align-items:center;gap:12px;margin-top:16px;padding:0 8px;}
.led{width:10px;height:10px;border-radius:50%;background:#4a3a20;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);transition:background .3s, box-shadow .3s;}
.led.amber{background:#ffb300;box-shadow:0 0 9px rgba(255,179,0,.8), inset 0 0 2px rgba(255,255,255,.6);}
.led.green{background:#22ff66;box-shadow:0 0 9px rgba(34,255,102,.8), inset 0 0 2px rgba(255,255,255,.6);animation:pulse 2.2s ease-in-out infinite;}
.led.red{background:#ff3030;box-shadow:0 0 11px rgba(255,48,48,.9), inset 0 0 2px rgba(255,255,255,.5);}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(34,255,102,.4), inset 0 0 2px rgba(255,255,255,.6);}}
.brand{font-weight:700;letter-spacing:4px;color:#6a5a3a;font-size:14px;}
.bezel-sub{color:#8a7a58;font-size:10px;letter-spacing:2px;}
.knobs{margin-left:auto;display:flex;gap:12px;}
.knob{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #9a8a66, #4a3a24 75%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.5), 0 1px 2px rgba(255,255,255,.4);position:relative;}
.knob::after{content:"";position:absolute;left:50%;top:2px;width:2px;height:7px;background:#2a2018;transform:translateX(-50%);}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;color:var(--dim);font-size:12px;letter-spacing:1px;}
.ctl{display:flex;align-items:center;gap:6px;}
.key{display:inline-block;background:linear-gradient(#333a48,#202634);border:1px solid #4a5268;border-bottom:3px solid #0e1218;border-radius:5px;padding:3px 8px;color:#dfe6f5;font-size:11px;min-width:24px;text-align:center;transition:transform .06s, box-shadow .06s, color .06s;}
.key.down{transform:translateY(2px);border-bottom-width:1px;box-shadow:0 0 12px rgba(0,255,255,.45);color:#fff;}
.btn{cursor:pointer;background:#161d2c;color:var(--cyan);border:1px solid #2a3550;border-radius:6px;padding:6px 14px;font:inherit;font-size:12px;letter-spacing:1px;transition:transform .15s, box-shadow .15s, background .15s;}
.btn:hover{background:#1d2740;box-shadow:0 0 14px rgba(0,255,255,.28);transform:translateY(-1px);}
.btn:active{transform:translateY(1px);}
.touch-hint{display:none;color:#5a6478;}
footer{color:#5a6478;font-size:11px;letter-spacing:1px;text-align:center;line-height:1.7;}
footer b{color:#9aa3b8;}

@media (max-width:720px){
  .wrap{padding:16px 10px 30px;gap:13px;}
  .cart{flex-wrap:wrap;}
  .cart-ridges{width:100%;height:14px;margin:0 0 10px;}
  .cart-label{flex:1 1 100%;gap:12px;padding:8px 12px;}
  .cart-badge{margin:10px 0 0;align-self:flex-start;}
  .monitor{padding:14px 14px 12px;border-radius:18px;}
  .screen{padding:8px;border-radius:10px;}
  .bezel-sub{display:none;}
  .controls{gap:10px 14px;font-size:11px;}
}
@media (pointer:coarse){.touch-hint{display:flex;}}
@media (prefers-reduced-motion:reduce){
  body::before,body::after,.crt,.led,.insert-line .blk{animation:none;}
}
</style>
</head>

<script>
'use strict';
/* ================= C64 palette + 3x5 pixel font ================= */
const PAL=['#000000','#ffffff','#00ffff','#ae0000','#00a800','#0000aa','#ffff07','#ff0000','#00ff00','#0000ff','#ffa500','#88ff88','#8888ff','#ff00ff','#ff8888','#888888'];
const FONT={
'A':["010","101","111","101","101"],'B':["110","101","110","101","110"],
'C':["011","100","100","100","011"],'D':["110","101","101","101","110"],
'E':["111","100","110","100","111"],'F':["111","100","110","100","100"],
'G':["011","100","101","101","011"],'H':["101","101","111","101","101"],
'I':["111","010","010","010","111"],'J':["001","001","001","101","010"],
'K':["101","101","110","101","101"],'L':["100","100","100","100","111"],
'M':["101","111","111","101","101"],'N':["101","111","111","111","101"],
'O':["010","101","101","101","010"],'P':["110","101","110","100","100"],
'Q':["010","101","101","010","011"],'R':["110","101","110","101","101"],
'S':["011","100","010","001","110"],'T':["111","010","010","010","010"],
'U':["101","101","101","101","111"],'V':["101","101","101","101","010"],
'W':["101","101","101","111","101"],'X':["101","101","010","101","101"],
'Y':["101","101","010","010","010"],'Z':["111","001","010","100","111"],
'0':["111","101","101","101","111"],'1':["010","110","010","010","111"],
'2':["111","001","010","100","111"],'3':["111","001","111","001","111"],
'4':["101","101","111","001","001"],'5':["111","100","110","001","111"],
'6':["011","100","111","101","111"],'7':["111","001","010","010","010"],
'8':["010","101","010","101","010"],'9':["111","101","111","001","011"],
' ':["000","000","000","000","000"],'.':["000","000","000","000","010"],
',':["000","000","000","010","100"],'-':["000","000","111","000","000"],
':':["000","010","000","010","000"],'/':["001","001","010","100","100"],
'!':["010","010","010","000","010"],'+':["000","010","111","010","000"],
'>':["100","010","001","010","100"],'<':["001","010","100","010","001"],
'?':["111","001","010","000","010"],'"':["111","000","111","000","000"],
"'":["010","010","000","000","000"],'(':["010","100","100","100","010"],
')':["010","001","001","001","010"],'=':["000","111","000","111","000"],
'*':["000","101","010","101","000"],'©':["010","101","111","101","010"]
};
function textW(t,s){s=s||1;return t.length*4*s-s;}
function drawText(g,txt,x,y,ci,s){
  s=s||1; g.fillStyle=(typeof ci==='number')?PAL[ci]:ci;
  let cx=Math.round(x); const y0=Math.round(y);
  for(let i=0;i<txt.length;i++){
    const gl=FONT[txt[i]]||FONT['?'];
    for(let r=0;r<5;r++){const row=gl[r];
      for(let c=0;c<3;c++) if(row[c]==='1') g.fillRect(cx+c*s,y0+r*s,s,s);}
    cx+=4*s;
  }
}

/* ================= sprites (hex chars = palette indices) ================= */
function spr(rows){
  const h=rows.length,w=rows[0].length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){const r=rows[y];
    for(let x=0;x<w;x++){const ch=r[x];
      if(ch!=='.'){g.fillStyle=PAL[parseInt(ch,16)];g.fillRect(x,y,1,1);}}}
  return c;
}
const SHIP=[
".......1.......","......111......",".....11111.....","....1111111....",
"...111111111...","..11111111111..",".1111111122222.","111111111222222",
".1111111122222.","..11111111111..","...111111111...","....1111111....",
".....11111.....","......111......",".......1......."
];
const DRONE=[
"....3333....","..33333333..",".3333333333.","333333333333",
"331133113333","333333333333",".3333333333.","..33333333..","....3333...."
];
const DIVER=[
"1.........","14........","144.......","1444......","14444.....",
"144444....","144444....","14444.....","1444......","144.......",
"14........","1........."
];
const TANK=[
"......AAAA......","....AAAAAAAA....","FFAA33AAAAAAA...","FFAA33AAAAAAAA..",
"AAAAAAAAAAAAAA..","AAAAAAAAAAAAAA..","FFAA33AAAAAAAA..","FFAA33AAAAAAA...",
"....AAAAAAAA....","......AAAA......"
];
const BOSS=[
"..........DDDDDDDDDD........",".......DDDDDDDDDDDDDDDD.....",
".....DDDDDDDDDDDDDDDDDDDD...","...DDDDDDDDDDDDDDDDDDDDDDDD.",
"..DDDDDDDDDDDDDDDDDDDDDDDDDD",".DDDDDDDDDDDDDDDDDDDDDDDDDDD",
"DDDDDDDDDD22DDDDDDDDDD22DDDD","DDDDDDDDDDDDDDDDDDDDDDDDDDDD",
"DDDDDDDDDDDD77777777DDDDDDDD","DDDDDDDDDDDD77777777DDDDDDDD",
"FFFFDDDDDDDD77222277DDDDDDDD","FFFFDDDDDDDD77222277DDDDDDDD",
"DDDDDDDDDDDD77222277DDDDDDDD","DDDDDDDDDDDD77777777DDDDDDDD",
"DDDDDDDDDDDD77777777DDDDDDDD","DDDDDDDDDDDDDDDDDDDDDDDDDDDD",
"DDDDDDDDDD22DDDDDDDDDD22DDDD",".DDDDDDDDDDDDDDDDDDDDDDDDDDD",
"..DDDDDDDDDDDDDDDDDDDDDDDDDD","...DDDDDDDDDDDDDDDDDDDDDDDD.",
".....DDDDDDDDDDDDDDDDDDDD...",".......DDDDDDDDDDDDDDDD.....",
"..........DDDDDDDDDD........","............DDDDDD............"
];
const PU_DOUBLE=["66....66..","66....66..","66....66..","66....66..","66....66..","66....66..","66....66..","66....66..","66....66..","66....66.."];
const PU_RAPID=[".....AA...","....AA....","...AA.....","..AAAAAA..",".....AA...","....AA....","...AA.....","..AA......",".AA.......","AA........"];
const PU_SHIELD=["...2222...","..2....2..",".2......2.",".2......2.","2........2","2........2","2........2",".2......2.","..2....2..","...2222..."];
const PU_LIFE=["...8888...","...8888...","8888888888","8888888888","8888888888","8888888888","8888888888","8888888888","...8888...","...8888..."];
const SPR={
  ship:spr(SHIP),drone:spr(DRONE),diver:spr(DIVER),tank:spr(TANK),boss:spr(BOSS),
  bulletP:spr(["666666","666666"]),bulletE:spr(["7777","7777"]),
  puDouble:spr(PU_DOUBLE),puRapid:spr(PU_RAPID),puShield:spr(PU_SHIELD),puLife:spr(PU_LIFE)
};
const ESPR={ship:[15,15],drone:[12,9],diver:[12,12],tank:[16,10],boss:[32,24],bulletP:[6,2],bulletE:[4,2],puDouble:[10,10],puRapid:[10,10],puShield:[10,10],puLife:[10,10]};

/* ================= canvas / dom ================= */
const W=320,H=200;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const led=document.getElementById('led');
const crt=document.getElementById('crt');
const screenEl=document.getElementById('screen');
const btnSound=document.getElementById('btnSound');
const btnRestart=document.getElementById('btnRestart');

/* ================= audio (WebAudio, no assets) ================= */
const SFX={
  ctx:null,master:null,on:true,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.master.gain.value=this.on?0.4:0;
    this.master.connect(this.ctx.destination);
  },
  setOn(v){this.on=v;if(this.master)this.master.gain.value=v?0.4:0;},
  tone(f,dur,type,vol,slideTo,when){
    if(!this.ctx||!this.on)return;
    type=type||'square';vol=vol||0.2;when=when||0;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  noise(dur,vol,when){
    if(!this.ctx||!this.on)return;
    vol=vol||0.3;when=when||0;
    const t=this.ctx.currentTime+when;
    const n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);
  },
  shoot(){this.tone(880,0.08,'square',0.08,220);},
  boom(big){this.noise(big?0.6:0.3,big?0.5:0.3);this.tone(big?110:160,big?0.5:0.25,'sawtooth',0.25,40);},
  hit(){this.tone(90,0.3,'sawtooth',0.35,30);this.noise(0.2,0.25);},
  power(){[440,660,880,1320].forEach((f,i)=>this.tone(f,0.09,'square',0.15,null,i*0.07));},
  oneup(){[523,659,784,1046].forEach((f,i)=>this.tone(f,0.12,'triangle',0.2,null,i*0.09));},
  warn(){this.tone(220,0.3,'square',0.2,180);this.tone(220,0.3,'square',0.2,180,0.4);},
  start(){[262,330,392,523].forEach((f,i)=>this.tone(f,0.12,'square',0.18,null,i*0.08));},
  over(){[392,330,262,196,131].forEach((f,i)=>this.tone(f,0.25,'triangle',0.25,null,i*0.22));}
};
const MUSIC={
  step:0,next:0,playing:false,
  bass:[110,0,110,0,110,0,220,0,87.31,0,87.31,0,98,0,98,0],
  lead:[329.63,0,440,0,523.25,0,440,0,329.63,0,392,0,493.88,0,392,0],
  start(){if(!SFX.ctx)return;this.step=0;this.next=SFX.ctx.currentTime+0.1;this.playing=true;},
  stop(){this.playing=false;},
  tick(){
    if(!this.playing)return;
    const c=SFX.ctx;if(!c||c.state!=='running')return;
    const sd=60/132/2;
    if(this.next<c.currentTime-0.3)this.next=c.currentTime+0.05;
    if(!SFX.on){while(this.next<c.currentTime+0.15){this.next+=sd;this.step++;}return;}
    while(this.next<c.currentTime+0.15){
      const s=this.step%16,b=this.bass[s],l=this.lead[s];
      if(b)SFX.tone(b,sd*0.85,'square',0.14,null,Math.max(0,this.next-c.currentTime));
      if(l)SFX.tone(l,sd*0.7,'triangle',0.10,null,Math.max(0,this.next-c.currentTime));
      this.next+=sd;this.step++;
    }
  }
};
function resumeAC(){if(SFX.ctx&&SFX.ctx.state==='suspended')SFX.ctx.resume();}

/* ================= state ================= */
let state='boot',paused=false,time=0,bootT=0,titleT=0,overT=0;
let score=0,hi=0,lives=3,wave=0,newHi=false,prevHi=0;
try{hi=parseInt(localStorage.getItem('delta_hi')||'0',10)||0;}catch(e){}
let player=null,bullets=[],ebullets=[],enemies=[],powerups=[],particles=[],popups=[];
let boss=null,spawnQ=[],spawnT=0,banner=null,shake=0,waveClearT=0,dying=false,dyingT=0;
const keys={};
const touch={active:false,x:0,y:0};

const BOOT_LINES=[
 {t:0.25,s:'**** C64 64K RAM SYSTEM   38911 BASIC BYTES FREE'},
 {t:1.0, s:'READY.'},
 {t:1.7, s:'LOAD "DELTA"'},
 {t:2.3, s:'OK'}
];

/* starfield + planet */
const stars=[];
function initStars(){
  stars.length=0;
  const layers=[{n:42,sp:6,c:'#3a3f52'},{n:26,sp:16,c:'#7a8296'},{n:12,sp:42,c:'#ffffff'}];
  layers.forEach(function(L,li){for(let i=0;i<L.n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,sp:L.sp,c:L.c,li:li});});
}
function updateStars(dt){for(const s of stars){s.x-=s.sp*dt;if(s.x<0){s.x+=W;s.y=Math.random()*H;}}}
function drawStars(){for(const s of stars){ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,s.li===2?2:1,1);}}
let planetC=null,planet={x:380,y:50};
function makePlanet(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='#1b2a52';g.beginPath();g.arc(32,32,32,0,6.29);g.fill();

  g.fillStyle='#12203e';
  [[18,22,6],[42,16,4],[48,42,7],[24,46,5],[36,54,4],[54,28,3]].forEach(function(p){g.beginPath();g.arc(p[0],p[1],p[2],0,6.29);g.fill();});
  return c;
}
function updatePlanet(dt){planet.x-=5*dt;if(planet.x<-70){planet.x=W+40+Math.random()*160;planet.y=30+Math.random()*140;}}
function drawPlanet(){if(planetC)ctx.drawImage(planetC,planet.x|0,planet.y|0);}

/* ================= game flow ================= */
function setState(s){
  state=s;
  if(s==='boot')bootT=0;
  if(s==='title')titleT=0;
  if(s==='over')overT=0;
  led.className='led '+(s==='play'?'green':s==='over'?'red':'amber');
  if(s==='play')MUSIC.start();else MUSIC.stop();
}
function resetGame(){
  score=0;lives=3;wave=0;newHi=false;
  bullets=[];ebullets=[];enemies=[];powerups=[];particles=[];popups=[];
  boss=null;spawnQ=[];spawnT=0;banner=null;shake=0;waveClearT=0;dying=false;dyingT=0;time=0;
  player={x:20,y:100,cd:0,inv:0,shield:false,double:0,rapid:0};
}
function startGame(){
  prevHi=hi;
  resetGame();
  setState('play');
  startWave(1);
  SFX.start();
}
function startWave(n){
  wave=n;spawnQ=[];spawnT=1.4;waveClearT=0;
  if(n%5===0){
    banner={text:'! WARNING !',color:7,t:0,dur:2.4,blink:true};
    SFX.warn();
    spawnQ.push({type:'boss',iv:2.4});
  }else{
    banner={text:'WAVE '+n,color:2,t:0,dur:1.5};
    const drones=Math.min(5+n*2,22);
    const divers=n>=2?Math.min(1+n,12):0;
    const tanks=n>=3?Math.min(Math.floor(n/2),6):0;
    const pool=[];
    for(let i=0;i<drones;i++)pool.push('drone');
    for(let i=0;i<divers;i++)pool.push('diver');
    for(let i=0;i<tanks;i++)pool.push('tank');
    const order=[];
    while(pool.length){
      for(const t of['drone','diver','tank']){
        let i;
        while((i=pool.indexOf(t))>=0)order.push(pool.splice(i,1)[0]);
      }
    }
    const base=Math.max(0.35,1.05-n*0.05);
    for(const t of order)spawnQ.push({type:t,iv:base*(0.7+Math.random()*0.6)});
  }
}
function spawnEnemy(type){
  const y=30+Math.random()*(H-60);
  const e={type:type,x:330,y:y,baseY:y,t:Math.random()*6,hp:1,flash:0,fireT:1+Math.random()};
  if(type==='tank')e.hp=3;
  enemies.push(e);
}
function spawnBoss(){
  const hp=34+((wave/5-1)|0)*16;
  boss={x:340,y:100,t:0,hp:hp,maxHp:hp,phase:'enter',fire1:1.6,fire2:3};
}
function dropPower(x,y){
  const r=Math.random();
  const type=r<0.3?'double':r<0.6?'rapid':r<0.88?'shield':'life';
  powerups.push({type:type,x:Math.max(4,Math.min(W-14,x-5)),y:Math.max(20,Math.min(H-14,y-5)),t:Math.random()*6});
}
function explosion(x,y,big){
  const n=big?26:12,cols=[1,6,10,7];
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,sp=(big?40:20)+Math.random()*(big?120:60);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:0.35+Math.random()*(big?0.5:0.3),ci:cols[(Math.random()*4)|0],s:Math.random()<0.3?2:1});
  }
  if(particles.length>320)particles.splice(0,particles.length-320);
}
function spark(x,y){
  for(let i=0;i<4;i++){
    const a=Math.random()*6.28,sp=20+Math.random()*50;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:0.25,ci:6,s:1});
  }
  if(particles.length>320)particles.splice(0,particles.length-320);
}
function killEnemy(j){
  const e=enemies[j];enemies.splice(j,1);
  const s=ESPR[e.type],cx=e.x+s[0]/2,cy=e.y+s[1]/2;
  const pts={drone:100,diver:200,tank:300}[e.type];
  score+=pts;if(score>hi)hi=score;
  popups.push({x:cx-14,y:cy-8,txt:''+pts,ci:1,t:0,dur:0.8});
  explosion(cx,cy,e.type==='tank');
  SFX.boom(e.type==='tank');
  const chance={drone:0.10,diver:0.12,tank:0.4}[e.type];
  if(Math.random()<chance)dropPower(cx,cy);
}
function killBoss(){
  const cx=boss.x+16,cy=boss.y+12;
  score+=2000;if(score>hi)hi=score;
  popups.push({x:cx-24,y:cy-16,txt:'2000',ci:6,t:0,dur:1.4});
  explosion(cx,cy,true);explosion(cx-12,cy-8,true);explosion(cx+10,cy+8,true);
  shake=8;SFX.boom(true);
  dropPower(cx-10,cy-10);
  powerups.push({type:'life',x:cx+8,y:cy+10,t:0});
  boss=null;
}
function hitPlayer(){
  const p=player;
  if(p.inv>0||dying)return;
  if(p.shield){p.shield=false;p.inv=1.2;SFX.hit();explosion(p.x+7,p.y,false);shake=3;return;}
  lives--;SFX.hit();SFX.boom(true);shake=6;
  explosion(p.x+7,p.y,true);
  if(lives<0){dying=true;dyingT=1.6;}
  else{p.x=20;p.y=100;p.inv=2.4;p.shield=false;p.double=0;p.rapid=0;}
}
function updateFx(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.t+=dt;
    if(p.t>=p.life){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=(1-2.2*dt);p.vy*=(1-2.2*dt);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];p.t+=dt;
    if(p.t>=p.dur)popups.splice(i,1);
  }
}
function updatePlay(dt){
  if(banner){banner.t+=dt;if(banner.t>=banner.dur)banner=null;}
  if(!dying){
    const p=player;
    if(p.inv>0)p.inv-=dt;
    if(p.double>0)p.double-=dt;
    if(p.rapid>0)p.rapid-=dt;
    if(p.cd>0)p.cd-=dt;
    let mx=0,my=0;
    if(keys.ArrowLeft||keys.a||keys.A)mx-=1;
    if(keys.ArrowRight||keys.d||keys.D)mx+=1;
    if(keys.ArrowUp||keys.w||keys.W)my-=1;
    if(keys.ArrowDown||keys.s||keys.S)my+=1;
    if(touch.active){
      const dx=touch.x-p.x,dy=touch.y-p.y,d=Math.hypot(dx,dy);
      if(d>6){const sp=Math.min(180,d*8);p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;}
    }else if(mx||my){
      const d=Math.hypot(mx,my);
      p.x+=mx/d*135*dt;p.y+=my/d*135*dt;
    }
    p.x=Math.max(8,Math.min(248,p.x));
    p.y=Math.max(18,Math.min(H-10,p.y));
    if((keys[' ']||touch.active)&&p.cd<=0){
      p.cd=p.rapid>0?0.09:0.18;
      if(p.double>0){bullets.push({x:p.x+15,y:p.y-4,vx:340});bullets.push({x:p.x+15,y:p.y+3,vx:340});}
      else bullets.push({x:p.x+15,y:p.y-1,vx:340});
      SFX.shoot();
    }
  }else{
    dyingT-=dt;
    if(dyingT<=0){
      newHi=score>prevHi;
      if(newHi){try{localStorage.setItem('delta_hi',''+hi);}catch(e){}}
      setState('over');SFX.over();
    }
  }
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;if(b.x>W+8)bullets.splice(i,1);}
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-10||b.x>W+10||b.y<-10||b.y>H+10)ebullets.splice(i,1);}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.type==='drone'){e.x-=(55+wave*3)*dt;e.y=e.baseY+Math.sin(e.t*2.4)*14;}
    else if(e.type==='diver'){
      if(e.x>252)e.x-=95*dt;
      else if(!dying){
        const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
        const sp=115+wave*3;
        e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;
        e.y=Math.max(16,Math.min(H-8,e.y));
      }else e.x-=95*dt;
    }
    else if(e.type==='tank'){
      e.x-=26*dt;
      const dy=player.y-e.y;
      e.y+=Math.max(-22,Math.min(22,dy))*dt;
      e.fireT-=dt;
      if(e.fireT<=0&&e.x<305&&e.x>player.x+12){
        e.fireT=Math.max(1.0,1.8-wave*0.06);
        const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
        if(ebullets.length<50)ebullets.push({x:e.x-4,y:e.y-1,vx:dx/d*100,vy:dy/d*100});
      }
    }
    if(e.x<-20)enemies.splice(i,1);
  }
  if(boss){
    if(boss.phase==='enter'){boss.x-=45*dt;if(boss.x<=252){boss.x=252;boss.phase='fight';}}
    else{
      boss.t+=dt;
      boss.y=100+Math.sin(boss.t*0.8)*66;
      if(!dying){
        boss.fire1-=dt;boss.fire2-=dt;
        const low=boss.hp<boss.maxHp*0.35;
        if(boss.fire1<=0){
          boss.fire1=low?0.75:1.35;
          const bx=boss.x,by=boss.y+12;
          const base=Math.atan2(player.y-by,player.x-bx);
          if(ebullets.length<50)for(const a of[-0.22,0,0.22])ebullets.push({x:bx,y:by,vx:Math.cos(base+a)*105,vy:Math.sin(base+a)*105});
        }
        if(boss.fire2<=0){
          boss.fire2=low?1.7:2.6;
          const bx=boss.x,by=boss.y+12;
          if(ebullets.length<50)for(const o of[0,0.35,-0.35,0.7,-0.7])ebullets.push({x:bx,y:by,vx:Math.cos(Math.PI+o)*85,vy:Math.sin(Math.PI+o)*85});
        }
      }
    }
  }
  if(spawnQ.length){
    spawnT-=dt;
    if(spawnT<=0){
      const s=spawnQ.shift();
      if(s.type==='boss')spawnBoss();
      else{spawnEnemy(s.type);spawnT=s.iv;}
    }
  }
  for(let i=powerups.length-1;i>=0;i--){const u=powerups[i];u.t+=dt;u.x-=38*dt;u.y+=Math.sin(u.t*3)*0.35;if(u.x<-12)powerups.splice(i,1);}
  /* collisions */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j],s=ESPR[e.type];
      if(b.x+6>e.x&&b.x<e.x+s[0]&&b.y+2>e.y&&b.y<e.y+s[1]){
        hit=true;e.hp--;e.flash=0.08;spark(b.x+3,b.y+1);
        if(e.hp<=0)killEnemy(j);
        break;
      }
    }
    if(!hit&&boss&&boss.phase==='fight'&&b.x+6>boss.x&&b.x<boss.x+32&&b.y+2>boss.y&&b.y<boss.y+24){
      hit=true;boss.hp--;spark(b.x+3,b.y+1);
      if(boss.hp<=0)killBoss();
    }
    if(hit)bullets.splice(i,1);
  }
  if(!dying&&player.inv<=0){
    const p=player,px=p.x+1,py=p.y-4,pw=12,ph=8;
    for(let i=ebullets.length-1;i>=0;i--){
      const b=ebullets[i];
      if(b.x+4>px&&b.x<px+pw&&b.y+2>py&&b.y<py+ph){ebullets.splice(i,1);hitPlayer();break;}
    }
  }
  if(!dying&&player.inv<=0){
    const p=player,px=p.x+1,py=p.y-4,pw=12,ph=8;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j],s=ESPR[e.type];
      if(e.x<px+pw&&e.x+s[0]>px&&e.y<py+ph&&e.y+s[1]>py){
        if(e.type==='tank'){e.hp--;e.flash=0.1;if(e.hp<=0)killEnemy(j);}
        else killEnemy(j);
        hitPlayer();break;
      }
    }
    if(boss&&boss.phase==='fight'&&boss.x<px+pw&&boss.x+32>px&&boss.y<py+ph&&boss.y+24>py)hitPlayer();
  }
  if(!dying){
    const p=player;
    for(let i=powerups.length-1;i>=0;i--){
      const u=powerups[i];
      if(u.x+10>p.x-2&&u.x<p.x+14&&u.y+10>p.y-6&&u.y<p.y+8){
        powerups.splice(i,1);
        if(u.type==='double'){p.double=15;SFX.power();popups.push({x:u.x,y:u.y-4,txt:'DOUBLE!',ci:6,t:0,dur:1});}
        else if(u.type==='rapid'){p.rapid=15;SFX.power();popups.push({x:u.x,y:u.y-4,txt:'RAPID!',ci:10,t:0,dur:1});}
        else if(u.type==='shield'){p.shield=true;SFX.power();popups.push({x:u.x,y:u.y-4,txt:'SHIELD!',ci:2,t:0,dur:1});}
        else{lives=Math.min(lives+1,5);SFX.oneup();popups.push({x:u.x,y:u.y-4,txt:'1UP!',ci:8,t:0,dur:1});}
      }
    }
  }
  if(!boss&&!dying&&spawnQ.length===0&&enemies.length===0){
    waveClearT+=dt;
    if(waveClearT>1.6){
      waveClearT=0;
      score+=250;if(score>hi)hi=score;
      popups.push({x:W/2-32,y:92,txt:'BONUS 250',ci:6,t:0,dur:1.2});
      startWave(wave+1);
    }
  }else waveClearT=0;
  updateFx(dt);
}
function update(dt){
  updateStars(dt);updatePlanet(dt);
  if(shake>0)shake=Math.max(0,shake-dt*10);
  if(state==='boot'){bootT+=dt;if(bootT>3.6)setState('title');}
  else if(state==='title'){titleT+=dt;}
  else if(state==='over'){overT+=dt;updateFx(dt);}
  else if(state==='play'){time+=dt;updatePlay(dt);}
}

/* ================= rendering ================= */
function drawBoot(){
  let last=10,shown=-1;
  for(let i=0;i<BOOT_LINES.length;i++){
    const l=BOOT_LINES[i];
    if(bootT>=l.t){drawText(ctx,l.s,8,10+i*10,1);last=10+i*10;shown=i;}
  }
  if(shown>=0&&Math.floor(bootT*2.5)%2===0){
    ctx.fillStyle=PAL[1];
    ctx.fillRect(8+textW(BOOT_LINES[shown].s)+3,last-1,6,8);
  }
}

function drawHUD(){

function drawBanner(){
  const b=banner;
  if(b.blink&&Math.floor(b.t*4)%2===0)return;
  const w=textW(b.text,2);
  drawText(ctx,b.text,(W-w)/2+2,86,0,2);
  drawText(ctx,b.text,(W-w)/2,84,b.color,2);

function drawPlayer(){
  const p=player;
  if(!p||dying)return;
  if(p.inv>0&&Math.floor(time*14)%2===0)return;
  if(Math.floor(time*20)%2===0){
    ctx.fillStyle=PAL[10];
    ctx.fillRect(p.x-4,p.y+6,3,1);ctx.fillRect(p.x-4,p.y+8,3,1);
    ctx.fillStyle=PAL[6];
    ctx.fillRect(p.x-6,p.y+7,2,1);
  }
  ctx.drawImage(SPR.ship,p.x|0,p.y|0);
  if(p.shield){
    ctx.globalAlpha=0.75+0.25*Math.sin(time*6);
    ctx.strokeStyle=PAL[2];
    ctx.beginPath();ctx.arc(p.x+7,p.y+7,13,0,6.29);ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=PAL[p.ci];
    ctx.fillRect(p.x|0,p.y|0,p.s,p.s);
  }
  ctx.globalAlpha=1;
}
function drawPopups(){
  for(const p of popups){
    ctx.globalAlpha=Math.max(0,1-p.t/p.dur);
    drawText(ctx,p.txt,p.x,p.y-p.t*14,p.ci);
  }
  ctx.globalAlpha=1;
}
function drawOverOverlay(){ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);}
function drawOverText(){
  drawText(ctx,'GAME OVER',(W-textW('GAME OVER',3))/2,58,7,3);
  drawText(ctx,'SCORE '+String(score).padStart(6,'0'),(W-textW('SCORE 000000'))/2,92,1);
  if(newHi&&Math.floor(overT*2)%2===0)
    drawText(ctx,'NEW HIGH SCORE!',(W-textW('NEW HIGH SCORE!'))/2,106,6);
  else
    drawText(ctx,'HI-SCORE '+String(hi).padStart(6,'0'),(W-textW('HI-SCORE 000000'))/2,106,2);
  if(Math.floor(overT*2)%2===0)
    drawText(ctx,'PRESS SPACE',(W-textW('PRESS SPACE'))/2,140,1);
  drawText(ctx,'THANKS FOR PLAYING',(W-textW('THANKS FOR PLAYING'))/2,170,15);
}
function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
  drawText(ctx,'PAUSED',(W-textW('PAUSED',2))/2,88,2,2);
  drawText(ctx,'P TO RESUME',(W-textW('P TO RESUME'))/2,104,15);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
  let ox=0,oy=0;
  if(shake>0.2){ox=(Math.random()*2-1)*shake;oy=(Math.random()*2-1)*shake;}
  ctx.save();
  ctx.translate(Math.round(ox),Math.round(oy));
  ctx.fillStyle='#000';ctx.fillRect(-8,-8,W+16,H+16);
  drawPlanet();drawStars();
  if(state==='boot'){drawBoot();ctx.restore();return;}
  if(state==='title'){drawTitle();ctx.restore();return;}
  for(const u of powerups){
    ctx.drawImage(SPR['pu'+u.type[0].toUpperCase()+u.type.slice(1)],u.x|0,u.y|0);
    if(Math.floor(u.t*5)%2===0){ctx.strokeStyle='#fff';ctx.strokeRect((u.x|0)-1.5,(u.y|0)-1.5,13,13);}
  }
  for(const e of enemies){
    ctx.drawImage(SPR[e.type],e.x|0,e.y|0);
    if(e.flash>0){ctx.globalAlpha=0.75;ctx.fillStyle='#fff';ctx.fillRect(e.x|0,e.y|0,ESPR[e.type][0],ESPR[e.type][1]);ctx.globalAlpha=1;}
  }
  if(boss){
    ctx.drawImage(SPR.boss,boss.x|0,boss.y|0);
    const frac=Math.max(0,boss.hp/boss.maxHp);
    ctx.fillStyle='#333';ctx.fillRect(boss.x|0,(boss.y-6)|0,32,3);
    ctx.fillStyle=PAL[7];ctx.fillRect(boss.x|0,(boss.y-6)|0,Math.round(32*frac),3);
  }
  for(const b of bullets)ctx.drawImage(SPR.bulletP,b.x|0,b.y|0);
  for(const b of ebullets)ctx.drawImage(SPR.bulletE,b.x|0,b.y|0);
  drawPlayer();
  drawParticles();
  drawPopups();
  if(state==='over')drawOverOverlay();
  drawHUD();
  if(banner)drawBanner();
  if(state==='over')drawOverText();
  if(paused&&state==='play')drawPause();
  ctx.restore();
}

/* ================= input ================= */
function handleKey(k){
  if(k==='m'||k==='M'){toggleSound();return;}
  if(state==='boot'){bootT=3.6;return;}
  if(state==='title'){if(k===' '||k==='Enter')startGame();return;}
  if(state==='over'){if(k===' '||k==='Enter')setState('title');return;}
  if(state==='play'){if(k==='p'||k==='P')togglePause();}
}
function togglePause(){
  if(state!=='play')return;
  paused=!paused;
  if(!paused&&SFX.ctx)MUSIC.next=SFX.ctx.currentTime+0.1;
}
function toggleSound(){
  SFX.init();
  SFX.setOn(!SFX.on);
  btnSound.textContent='SOUND: '+(SFX.on?'ON':'OFF');
}
addEventListener('keydown',function(e){
  const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight')e.preventDefault();
  if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();
  keys[k]=true;
  let kc=document.querySelector('.key[data-key="'+k+'"]');
  if(!kc&&k.length===1)kc=document.querySelector('.key[data-key="'+k.toLowerCase()+'"]');
  if(kc)kc.classList.add('down');
  SFX.init();resumeAC();
  if(!e.repeat)handleKey(k);
});
addEventListener('keyup',function(e){
  keys[e.key]=false;
  let kc=document.querySelector('.key[data-key="'+e.key+'"]');
  if(!kc&&e.key.length===1)kc=document.querySelector('.key[data-key="'+e.key.toLowerCase()+'"]');
  if(kc)kc.classList.remove('down');
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='play'&&!dying)paused=true;
});
cv.addEventListener('click',function(){
  SFX.init();resumeAC();
  if(state==='boot')bootT=3.6;
  else if(state==='title'||state==='over')startGame();
});
function setTouchFromEvent(t){
  const r=cv.getBoundingClientRect();
  touch.x=(t.clientX-r.left)/r.width*W;
  touch.y=(t.clientY-r.top)/r.height*H-46;
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();SFX.init();resumeAC();
  touch.active=true;
  const t=e.touches[0];setTouchFromEvent(t);
  if(state==='boot')bootT=3.6;
  else if(state==='title'||state==='over')startGame();
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(touch.active){const t=e.touches[0];setTouchFromEvent(t);}
},{passive:false});
cv.addEventListener('touchend',function(){touch.active=false;});
btnSound.addEventListener('click',function(){toggleSound();btnSound.blur();});
btnRestart.addEventListener('click',function(){
  SFX.init();resumeAC();
  if(state==='boot')bootT=3.6;else startGame();
  btnRestart.blur();
});

/* ================= layout / logo / favicon ================= */
function fitCanvas(){
  const pad=parseFloat(getComputedStyle(screenEl).paddingLeft)*2;
  const availW=screenEl.clientWidth-pad;
  const availH=Math.max(240,window.innerHeight*0.62);
  let s=Math.floor(Math.min(availW/W,availH/H));
  s=Math.max(1,Math.min(s,4));
  const px=W*s,py=H*s;
  cv.style.width=px+'px';cv.style.height=py+'px';
  crt.style.width=px+'px';crt.style.height=py+'px';
}
addEventListener('resize',fitCanvas);
(function drawLogo(){
  const lc=document.getElementById('logoCanvas');
  const g=lc.getContext('2d');
  g.clearRect(0,0,114,30);
  drawText(g,'DELTA',6,3,7,6);
  drawText(g,'DELTA',4,1,'#141414',6);
})();
try{
  const l=document.createElement('link');l.rel='icon';
  const fc=document.createElement('canvas');fc.width=16;fc.height=16;
  const fg=fc.getContext('2d');fg.imageSmoothingEnabled=false;
  fg.drawImage(SPR.ship,0,0,16,16);
  l.href=fc.toDataURL();document.head.appendChild(l);
}catch(e){}

/* ================= main loop ================= */
initStars();
planetC=makePlanet();
fitCanvas();
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000;last=t;
  if(dt>0.05)dt=0.05;
  if(!paused)update(dt);
  if(state==='play'&&!paused)MUSIC.tick();
  render();
}
requestAnimationFrame(frame);
</script>
</body>
