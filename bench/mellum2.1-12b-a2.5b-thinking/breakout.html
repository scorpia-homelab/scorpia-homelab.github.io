<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<style>
  body {
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    overflow:hidden;
  }
  canvas {
    border:4px solid #fff;
    background:#000;
    display:block;
  }
  #startScreen, #gameOver {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
    color:#fff;
    text-align:center;
  }
  button {
    margin-top:20px;
    padding:12px 24px;
    font-size:18px;
    background:#4CAF50;
    border:none;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.3s;
  }
  button:hover {
    background:#45a049;
  }
  #score, #lives {
    font-size:24px;
    margin:10px;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Breakout</h1>
  <p>Use Arrow Keys or A/D to move the paddle.</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameOver" style="display:none;">
  <h2>Game Over</h2>
  <div id="finalScore"></div>
  <button id="restartBtn">Play Again</button>
</div>

<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
(() => {
  // ---------- DOM Elements ----------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOver');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');

  // ---------- Game Constants ----------
  const PADDLE_WIDTH = 120;
  const PADDLE_HEIGHT = 10;
  const BALL_RADIUS = 10;
  const BRICK_ROWS = 4;
  const BRICK_COLS = 10;
  const BRICK_WIDTH = 60;
  const BRICK_HEIGHT = 20;
  const BRICK_PADDING = 10;
  const BRICK_OFFSET_TOP = 60;
  const BRICK_OFFSET_LEFT = 30;
  const PADDLE_SPEED = 8;
  const BALL_SPEED_X = 5;
  const BALL_SPEED_Y = 5;

  // ---------- Game State ----------
  let paddle = {
    x: (canvas.width - PADDLE_WIDTH) / 2,
    y: canvas.height - PADDLE_HEIGHT - 10,
    width: PADDLE_WIDTH,
    height: PADDLE_HEIGHT,
    speedX: 0
  };

  let ball = {
    x: canvas.width / 2,
    y: canvas.height / 2 - 50,
    radius: BALL_RADIUS,
    speedX: BALL_SPEED_X,
    speedY: BALL_SPEED_Y
  };

  let bricks = [];
  let score = 0;
  let lives = 3;
  let audioContext = null;

  // ---------- Initialization ----------
  function initBricks() {
    bricks = [];
    const colors = ['#FF6B6B', '#4ECDC4', '#97E5FF', '#FF9F43'];
    for (let r = 0; r < BRICK_ROWS; r++) {
      const brickColor = colors[r % colors.length];
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_OFFSET_LEFT + c * (BRICK_WIDTH + BRICK_PADDING),
          y: BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
          width: BRICK_WIDTH,
          height: BRICK_HEIGHT,
          color: brickColor,
          alive: true
        });
      }
    }
  }

  function initGame() {
    initBricks();
    score = 0;
    lives = 3;
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2 - 50;
    ball.speedX = BALL_SPEED_X;
    ball.speedY = BALL_SPEED_Y;
    paddle.x = (canvas.width - PADDLE_WIDTH) / 2;
    paddle.speedX = 0;
    updateScoreDisplay();
    gameOverScreen.style.display = 'none';
    startScreen.style.display = 'none';
  }

  function updateScoreDisplay() {
    document.getElementById('score').textContent = `Score: ${score}`;
    document.getElementById('lives').textContent = `Lives: ${lives}`;
    finalScoreEl.textContent = score;
  }

  // ---------- Drawing ----------
  function drawBricks() {
    ctx.fillStyle = '#000';
    bricks.forEach(brick => {
      if (brick.alive) {
        ctx.fillStyle = brick.color;
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
      }
    });
  }

  function drawPaddle() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawPaddle();
    drawBall();
  }

  // ---------- Audio ----------
  function getAudioContext() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
  }

  function playSound() {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    gain.gain.value = 0.05;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // ---------- Collision ----------
  function checkCollisions() {
    // Wall left/right
    if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
      ball.speedX = -ball.speedX;
      playSound();
    }
    // Top wall
    if (ball.y - ball.radius < 0) {
      ball.speedY = -ball.speedY;
      playSound();
    }
    // Paddle
    if (
      ball.y + ball.radius > paddle.y &&
      ball.x > paddle.x &&
      ball.x < paddle.x + paddle.width
    ) {
      // Adjust angle based on where hit
      const hitPos = (ball.x - paddle.x) / paddle.width;
      ball.speedX = (hitPos - 0.5) * 8;
      ball.speedY = -Math.abs(ball.speedY);
      playSound();
    }
    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const brick = bricks[i];
      if (!brick.alive) continue;
      if (
        ball.y - ball.radius < brick.y + brick.height &&
        ball.y + ball.radius > brick.y &&
        ball.x - ball.radius < brick.x + brick.width &&
        ball.x + ball.radius > brick.x
      ) {
        brick.alive = false;
        score += 10;
        updateScoreDisplay();
        // Bounce up
        ball.speedY = -ball.speedY;
        // Slight speed increase
        ball.speedX *= 1.05;
        ball.speedY *= 1.05;
        playSound();
        break;
      }
    }
  }

  // ---------- Game Loop ----------
  function update() {
    // Move paddle
    paddle.x += paddle.speedX;
    // Keep paddle on screen
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

    // Move ball
    ball.x += ball.speedX;
    ball.y += ball.speedY;

    checkCollisions();

    // Check ball below paddle
    if (ball.y + ball.radius > canvas.height) {
      lives--;
      updateScoreDisplay();
      if (lives <= 0) {
        gameOverScreen.style.display = 'block';
        return;
      }
      // Reset ball
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2 - 50;
      ball.speedX = BALL_SPEED_X;
      ball.speedY = BALL_SPEED_Y;
      // Small delay
      setTimeout(() => {}, 1000);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ---------- Event Listeners ----------
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      paddle.speedX = -PADDLE_SPEED;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      paddle.speedX = PADDLE_SPEED;
    }
  });

  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' ||
        e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      paddle.speedX = 0;
    }
  });

  startBtn.addEventListener('click', () => {
    initGame();
    gameLoop();
  });

  restartBtn.addEventListener('click', () => {
    initGame();
    gameLoop();
  });

  // Start screen hidden by default via CSS, but we can show it initially
  startScreen.style.display = 'block';

})();
</script>
</body>
</html>
