<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot & Julia Set Explorer</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(30, 30, 30, 0.9);
            --text-color: #eee;
            --accent: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 10px 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

        .container {
            display: flex;
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            cursor: crosshair;
            image-rendering: pixelated; /* Keeps the fractal sharp */
        }

        #controls {
            width: 300px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; color: #aaa; }
        
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            float: right;
            color: var(--accent);
            font-family: monospace;
        }

        .info-box {
            margin-top: auto;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        /* Tooltip for instructions */
        .tooltip {
            position: absolute;
            bottom: 20px;
            right: 350px; /* Offset by control panel width */
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

<header>
    <h1>Fractal Explorer</h1>
    <div style="font-size: 0.9rem;">Mandelbrot | Julia</div>
</header>

<div class="container">
    <!-- Mandelbrot Canvas -->
    <canvas id="mandelbrot" width="800" height="600"></canvas>
    
    <!-- Julia Canvas -->
    <canvas id="julia" width="800" height="600"></canvas>

    <div class="tooltip">
        Left Click + Drag: Pan<br>Scroll Wheel: Zoom
    </div>
</div>

<div id="controls">
    <div class="control-group">
        <label for="juliaCReal">Julia Real Part (c)</label>
        <input type="range" id="juliaCReal" min="-1.5" max="1.5" step="0.001" value="-0.743683">
        <span class="value-display" id="val-real">-0.74</span>
    </div>

    <div class="control-group">
        <label for="juliaCImag">Julia Imag Part (c)</label>
        <input type="range" id="juliaCImag" min="-1.5" max="1.5" step="0.001" value="0.236068">
        <span class="value-display" id="val-imag">0.24</span>
    </div>

    <div class="control-group">
        <label for="mandelZoom">Mandelbrot Zoom Level</label>
        <input type="range" id="mandelZoom" min="-10" max="5" step="0.1" value="-2">
        <span class="value-display" id="val-zoom">x 4.0</span>
    </div>

    <div class="info-box">
        Resolution: 800x600<br>
        Iterations: 500
    </div>
</div>

<script>
/**
 * Shared Math & Rendering Logic
 */
const MAX_ITERATIONS = 400; // Higher for better detail, lower for speed
const PALETTE = (n) => {
    // A vibrant palette based on iteration count
    const h = n / MAX_ITERATIONS * 360; 
    return `hsl(${h}, 100%, 50%)`;
};

// --- Mandelbrot State ---
const mandelState = {
    scale: 4.0, // Zoom level (inverse of width)
    offset: { x: -0.75, y: 0 }, // Center view
    isDragging: false,
    lastX: 0,
    lastY: 0
};

// --- Julia State ---
const juliaState = {
    cReal: -0.743683,
    cImag: 0.236068,
    scale: 1.5, // Zoom level
    offset: { x: -0.5, y: 0 } // Center view usually near origin for Julia
};

// --- Canvas Setup ---
const canvasM = document.getElementById('mandelbrot');
const ctxM = canvasM.getContext('2d', { alpha: false }); // Optimize for no transparency
const canvasJ = document.getElementById('julia');
const ctxJ = canvasJ.getContext('2d', { alpha: false });

function resizeCanvas() {
    // Keep internal resolution fixed at 800x600 for consistency, 
    // but CSS scales it via flexbox.
}

// --- Rendering Functions ---

function drawMandelbrot() {
    const w = canvasM.width;
    const h = canvasM.height;
    
    // Create ImageData buffer
    const imgData = ctxM.createImageData(w, h);
    const data = imgData.data;

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            // Map pixel to complex plane coordinates
            let zx = (x - w / 2) * mandelState.scale + mandelState.offset.x;
            let zy = (y - h / 2) * mandelState.scale + mandelState.offset.y;

            let nx = 0, ny = 0; // z_n starts at 0
            
            let iter = 0;
            
            // Optimization: Check bounds early if zoomed out too much
            if (zx*zx + zy*zy > 4) { 
                data[(y * w + x) * 4] = 255; R; G; B; A=255;
                continue;
            }

            // Main Loop
            while (nx * nx + ny * ny <= 4 && iter < MAX_ITERATIONS) {
                let temp = nx * nx - ny * ny + zx;
                ny = 2 * nx * ny + zy;
                nx = temp;
                iter++;
            }

            // Colorize based on iteration count
            if (iter === MAX_ITERATIONS) {
                data[(y * w + x) * 4] = 0; data[(y * w + x) * 4 + 1] = 0; 
                data[(y * w + x) * 4 + 2] = 0; // Black for inside set
            } else {
                const color = PALETTE(iter);
                const r = parseInt(color.slice(1,3), 16);
                const g = parseInt(color.slice(3,5), 16);
                const b = parseInt(color.slice(5,7), 16);
                
                data[(y * w + x) * 4] = r;
                data[(y * w + x) * 4 + 1] = g;
                data[(y * w + x) * 4 + 2] = b;
                data[(y * w + x) * 4 + 3] = 255; // Alpha
            }
        }
    }

    ctxM.putImageData(imgData, 0, 0);
}

function drawJulia() {
    const w = canvasJ.width;
    const h = canvasJ.height;

    const imgData = ctxJ.createImageData(w, h);
    const data = imgData.data;

    // Julia Formula: z_{n+1} = z_n^2 + c
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            let zx = (x - w / 2) * juliaState.scale + juliaState.offset.x;
            let zy = (y - h / 2) * juliaState.scale + juliaState.offset.y;

            let nx = 0, ny = 0; // Start at origin z=0
            
            let iter = 0;

            while (nx * nx + ny * ny <= 4 && iter < MAX_ITERATIONS) {
                let temp = nx * nx - ny * ny + zx;
                ny = 2 * nx * ny + zy;
                nx = temp;
                iter++;
            }

            if (iter === MAX_ITERATIONS) {
                data[(y * w + x) * 4] = 0; 
                data[(y * w + x) * 4 + 1] = 0; 
                data[(y * w + x) * 4 + 2] = 0; // Black for inside set
            } else {
                const color = PALETTE(iter);
                const r = parseInt(color.slice(1,3), 16);
                const g = parseInt(color.slice(3,5), 16);
                const b = parseInt(color.slice(5,7), 16);

                data[(y * w + x) * 4] = r;
                data[(y * w + x) * 4 + 1] = g;
                data[(y * w + x) * 4 + 2] = b;
                data[(y * w + x) * 4 + 3] = 255;
            }
        }
    }

    ctxJ.putImageData(imgData, 0, 0);
}

// --- Interaction Logic ---

function getMousePos(evt) {
    const rectM = canvasM.getBoundingClientRect();
    const rectJ = canvasJ.getBoundingClientRect();
    
    // Calculate relative to each canvas individually for panning logic
    return {
        x: evt.clientX - rectM.left,
        y: evt.clientY - rectM.top
    };
}

function updateView() {
    drawMandelbrot();
    drawJulia();
}

// Event Listeners for Mandelbrot (Left side)
canvasM.addEventListener('mousedown', e => {
    mandelState.isDragging = true;
    const pos = getMousePos(e);
    mandelState.lastX = pos.x;
    mandelState.lastY = pos.y;
});

window.addEventListener('mouseup', () => {
    mandelState.isDragging = false;
});

canvasM.addEventListener('mousemove', e => {
    if (!mandelState.isDragging) return;
    
    const pos = getMousePos(e);
    const dx = pos.x - mandelState.lastX;
    const dy = pos.y - mandelState.lastY;

    // Update offset based on drag distance relative to current scale
    mandelState.offset.x -= dx * mandelState.scale;
    mandelState.offset.y -= dy * mandelState.scale;

    mandelState.lastX = pos.x;
    mandelState.lastY = pos.y;
});

canvasM.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomIntensity = 0.1;
    
    // Get center of canvas for zoom pivot
    const rect = canvasM.getBoundingClientRect();
    const centerX = rect.width / 2 + mandelState.offset.x / mandelState.scale;
    const centerY = rect.height / 2 + mandelState.offset.y / mandelState.scale;

    if (e.deltaY < 0) {
        mandelState.scale *= (1 + zoomIntensity); // Zoom in
    } else {
        mandelState.scale /= (1 + zoomIntensity); // Zoom out
    }
    
    // Clamp scale
    mandelState.scale = Math.max(0.5, Math.min(mandelState.scale, 20));

    updateView();
});


// Event Listeners for Julia (Right side) & Controls
canvasJ.addEventListener('mousedown', e => {
    juliaState.isDragging = true; // Reuse state logic if we wanted shared drag, but keeping separate is safer here.
    const pos = getMousePos(e);
    juliaState.lastX = pos.x;
    juliaState.lastY = pos.y;
});

window.addEventListener('mouseup', () => {
    juliaState.isDragging = false;
});

canvasJ.addEventListener('mousemove', e => {
    if (!juliaState.isDragging) return;
    
    const pos = getMousePos(e); // Note: getMousePos is tied to canvasM rect, need fix for J
    // Fix for Julia mouse pos calculation using its own rect
    const rectJ = canvasJ.getBoundingClientRect();
    const juliaX = e.clientX - rectJ.left;
    const juliaY = e.clientY - rectJ.top;

    const dx = juliaX - juliaState.lastX;
    const dy = juliaY - juliaState.lastY;

    juliaState.offset.x -= dx * juliaState.scale;
    juliaState.offset.y -= dy * juliaState.scale;

    juliaState.lastX = juliaX;
    juliaState.lastY = juliaY;
});

canvasJ.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomIntensity = 0.1;
    
    // Similar logic to Mandelbrot but for Julia canvas rect
    const rectJ = canvasJ.getBoundingClientRect();
    const centerX = (rectJ.width / 2) + juliaState.offset.x / juliaState.scale;
    const centerY = (rectJ.height / 2) + juliaState.offset.y / juliaState.scale;

    if (e.deltaY < 0) {
        juliaState.scale *= (1 + zoomIntensity);
    } else {
        juliaState.scale /= (1 + zoomIntensity);
    }
    
    juliaState.scale = Math.max(0.5, Math.min(juliaState.scale, 20));

    updateView();
});


// Slider Controls
const sliderReal = document.getElementById('juliaCReal');
const sliderImag = document.getElementById('juliaCImag');
const valRealDisplay = document.getElementById('val-real');
const valImagDisplay = document.getElementById('val-imag');

sliderReal.addEventListener('input', (e) => {
    juliaState.cReal = parseFloat(e.target.value);
    valRealDisplay.innerText = juliaState.cReal.toFixed(4);
});

sliderImag.addEventListener('input', (e) => {
    juliaState.cImag = parseFloat(e.target.value);
    valImagDisplay.innerText = juliaState.cImag.toFixed(4);
});


// Initial Draw
updateView();

</script>
</body>
</html>
```
