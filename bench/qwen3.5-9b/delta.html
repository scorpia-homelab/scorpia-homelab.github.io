<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA - Retro Space Shooter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 5;
            pointer-events: none;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            font-size: 60px;
            margin: 0 0 20px 0;
            letter-spacing: 5px;
        }

        p {
            color: #fff;
            font-size: 18px;
            line-height: 1.5;
        }

        .blink {
            animation: blinker 1s linear infinite;
            color: #ff0;
            margin-top: 20px;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="scanlines"></div>
    <div class="ui-layer">
        SCORE: <span id="scoreVal">0</span>
    </div>
    
    <div id="start-screen">
        <h1>DELTA</h1>
        <p>ARROWS to Move</p>
        <p>SPACE to Shoot</p>
        <p class="blink">PRESS SPACE TO START</p>
    </div>
</div>

<script>
/**
 * DELTA - Retro Space Shooter
 * Inspired by Thalamus 1987 C64 classic.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const startScreen = document.getElementById('start-screen');

// Game Constants
const COLORS = {
    bg: '#000000',
    player: '#00ffff', // Cyan
    bullet: '#ffff00', // Yellow
    enemy1: '#ff00ff', // Magenta
    enemy2: '#00ff00', // Lime
    enemy3: '#ffffff', // White
    text: '#ffffff'
};

// Game State
let gameState = {
    running: false,
    score: 0,
    frames: 0,
    scrollSpeed: 2
};

// Input Handling
const keys = {
    ArrowLeft: false,
    ArrowRight: false,
    Space: false
};

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !gameState.running) {
        startGame();
        return;
    }
    if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
});

// --- CLASSES ---

class Star {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speed = Math.random() * 3 + 1;
        this.brightness = Math.random();
    }

    update() {
        this.y += this.speed;
        if (this.y > canvas.height) {
            this.y = 0;
            this.x = Math.random() * canvas.width;
        }
    }

    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 1.0;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.03;
    }

    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 3, 3);
        ctx.globalAlpha = 1.0;
    }
}

class Bullet {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 4;
        this.height = 10;
        this.speed = 10;
        this.active = true;
    }

    update() {
        this.y -= this.speed;
        if (this.y < 0) this.active = false;
    }

    draw() {
        ctx.fillStyle = COLORS.bullet;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

class Enemy {
    constructor() {
        this.width = 30;
        this.height = 30;
        this.x = Math.random() * (canvas.width - this.width);
        this.y = -50;
        this.speed = Math.random() * 2 + 2 + (gameState.score / 500); // Gets faster
        this.type = Math.floor(Math.random() * 3); // 0: Triangle, 1: Square, 2: Circle
        this.active = true;
        this.angle = 0;
    }

    update() {
        this.y += this.speed;
        if (this.y > canvas.height) this.active = false;
        
        // Rotate for visual flair
        this.angle += 0.05;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = this.type === 0 ? COLORS.enemy1 : (this.type === 1 ? COLORS.enemy2 : COLORS.enemy3);
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = 2;

        ctx.beginPath();
        if (this.type === 0) {
            // Triangle
            ctx.moveTo(0, -15);
            ctx.lineTo(15, 15);
            ctx.lineTo(-15, 15);
            ctx.closePath();
        } else if (this.type === 1) {
            // Square
            ctx.rect(-15, -15, 30, 30);
        } else {
            // Circle
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.stroke();
        
        // Inner detail
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.beginPath();
        if (this.type === 0) {
            ctx.moveTo(0, 5);
            ctx.lineTo(10, 15);
            ctx.lineTo(-10, 15);
            ctx.closePath();
        } else if (this.type === 1) {
            ctx.rect(-5, -5, 10, 10);
        } else {
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
        }
        ctx.fill();

        ctx.restore();
    }
}

class Player {
    constructor() {
        this.width = 40;
        this.height = 40;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 80;
        this.speed = 6;
        this.cooldown = 0;
    }

    update() {
        // Movement
        if (keys.ArrowLeft && this.x > 0) {
            this.x -= this.speed;
        }
        if (keys.ArrowRight && this.x < canvas.width - this.width) {
            this.x += this.speed;
        }

        // Shooting
        if (keys.Space && this.cooldown <= 0) {
            bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y));
            this.cooldown = 15; // Frames between shots
        }
        if (this.cooldown > 0) this.cooldown--;
    }

    draw() {
        ctx.fillStyle = COLORS.player;
        ctx.strokeStyle = COLORS.player;
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        // Draw a Delta (Triangle) shape
        ctx.moveTo(this.x + this.width/2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Engine glow
        ctx.fillStyle = '#ffaa00';
        ctx.globalAlpha = 0.5 + Math.random() * 0.5;
        ctx.beginPath();
        ctx.moveTo(this.x + 10, this.y + this.height);
        ctx.lineTo(this.x + 20, this.y + this.height + 10);
        ctx.lineTo(this.x + 30, this.y + this.height);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// --- GAME LOGIC ---

let player;
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

function init() {
    // Create starfield
    stars = [];
    for(let i=0; i<100; i++) {
        stars.push(new Star());
    }
}

function spawnEnemy() {
    // Spawn rate increases slightly with score
    if (gameState.frames % Math.max(20, 60 - Math.floor(gameState.score/10)) === 0) {
        enemies.push(new Enemy());
    }
}

function checkCollisions() {
    // Bullet vs Enemy
    bullets.forEach(bullet => {
        if (!bullet.active) return;
        enemies.forEach(enemy => {
            if (!enemy.active) return;
            
            // Simple AABB collision
            if (bullet.x < enemy.x + enemy.width &&
                bullet.x + bullet.width > enemy.x &&
                bullet.y < enemy.y + enemy.height &&
                bullet.y + bullet.height > enemy.y) {
                
                // Hit!
                bullet.active = false;
                enemy.active = false;
                gameState.score += 100;
                scoreEl.innerText = gameState.score;
                
                // Explosion
                for(let i=0; i<8; i++) {
                    particles.push(new Particle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.type === 0 ? COLORS.enemy1 : COLORS.enemy2));
                }
            }
        });
    });

    // Enemy vs Player
    enemies.forEach(enemy => {
        if (!enemy.active) return;
        
        // Simple distance check for player collision (hitbox is smaller than visual)
        const dx = (player.x + player.width/2) - (enemy.x + enemy.width/2);
        const dy = (player.y + player.height/2) - (enemy.y + enemy.height/2);
        const distance = Math.sqrt(dx*dx + dy*dy);

        if (distance < 30) {
            gameOver();
        }
    });
}

function gameOver() {
    gameState.running = false;
    startScreen.style.display = 'flex';
    startScreen.querySelector('h1').innerText = "GAME OVER";
    startScreen.querySelector('p').innerText = `Final Score: ${gameState.score}`;
    startScreen.querySelector('.blink').innerText = "PRESS SPACE TO RESTART";
}

function startGame() {
    gameState.running = true;
    gameState.score = 0;
    gameState.frames = 0;
    scoreEl.innerText = "0";
    startScreen.style.display = 'none';
    
    player = new Player();
    bullets = [];
    enemies = [];
    particles = [];
    
    // Initial burst of enemies
    for(let i=0; i<3; i++) {
        setTimeout(() => {
            if(gameState.running) enemies.push(new Enemy());
        }, i * 300);
    }
}

function loop() {
    if (!gameState.running) return;

    // Clear Screen
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Update & Draw Stars (Background)
    stars.forEach(star => {
        star.update();
        star.draw();
    });

    // Update & Draw Player
    player.update();
    player.draw();

    // Update & Draw Bullets
    bullets.forEach((bullet, index) => {
        bullet.update();
        bullet.draw();
        if (!bullet.active) bullets.splice(index, 1);
    });

    // Update & Draw Enemies
    spawnEnemy();
    enemies.forEach((enemy, index) => {
        enemy.update();
        enemy.draw();
        if (!enemy.active) enemies.splice(index, 1);
    });

    // Update & Draw Particles
    particles.forEach((particle, index) => {
        particle.update();
        particle.draw();
        if (particle.life <= 0) particles.splice(index, 1);
    });

    checkCollisions();

    gameState.frames++;
    requestAnimationFrame(loop);
}

// Start
init();
loop();

</script>
</body>
</html>
