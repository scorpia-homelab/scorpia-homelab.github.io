<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRICKSTORM — Arcade Brick Breaker</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="1" y="4" width="14" height="8" rx="2" fill="%23ffb454"/></svg>'>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#04141a; --line:#1c4652; --line2:#2c5a68;
  --ink:#e8f4f2; --dim:#7fa8b0;
  --amber:#ffb454; --gold:#ffd93d; --coral:#ff5d5d; --mint:#3ddc97; --cyan:#45d6ff; --pink:#ff5db1;
  --display:Impact,'Haettenschweiler','Franklin Gothic Bold','Arial Black',sans-serif;
  --mono:ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
html,body{height:100%}
body{
  font-family:var(--mono); color:var(--ink);
  background:
    radial-gradient(1100px 520px at 50% -8%, #14404f 0%, rgba(20,64,79,0) 60%),
    radial-gradient(800px 460px at 88% 108%, #0d3241 0%, rgba(13,50,65,0) 55%),
    var(--bg0);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   repeating-linear-gradient(0deg, rgba(120,210,235,.028) 0 1px, transparent 1px 46px),
   repeating-linear-gradient(90deg, rgba(120,210,235,.028) 0 1px, transparent 1px 46px);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%);}

.cabinet{position:relative;z-index:1;display:flex;flex-direction:column;
  width:min(96vw,940px);
  background:linear-gradient(180deg,#0d2530,#081a22);
  border:1px solid var(--line); border-radius:14px 14px 10px 10px;
  box-shadow:0 34px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);}

/* ── marquee ─────────────────────────────── */
.marquee{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 22px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#123543,#0a2029);
  border-radius:13px 13px 0 0;overflow:hidden;}
.marquee-title{font-family:var(--display);font-size:clamp(26px,4.6vw,42px);letter-spacing:3px;
  line-height:1;color:var(--ink);text-shadow:2px 2px 0 #062028,4px 4px 0 rgba(0,0,0,.35);}
.marquee-title span{color:var(--amber);text-shadow:2px 2px 0 #4a2a05,0 0 22px rgba(255,180,84,.55);animation:flick 6s infinite;}
@keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.45}93%{opacity:1}95%{opacity:.7}96%{opacity:1}}
.marquee-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10px;letter-spacing:2px;color:var(--dim);}
.marquee-side b{color:var(--gold);font-size:15px;letter-spacing:1px;}
.bulbs{position:absolute;left:0;right:0;bottom:0;height:7px;opacity:.75;
  background-image:radial-gradient(circle,var(--gold) 1.6px,rgba(255,217,61,.12) 2.6px,transparent 3.4px);
  background-size:26px 7px;animation:chase .9s steps(2) infinite;}
@keyframes chase{to{background-position-x:26px}}

/* ── HUD ─────────────────────────────────── */
.hud{display:flex;flex-wrap:wrap;align-items:stretch;padding:10px 18px;
  background:#0a1f28;border-bottom:1px solid var(--line);}
.cell{display:flex;flex-direction:column;gap:3px;padding:2px 16px 2px 0;margin-right:16px;border-right:1px solid var(--line);}
.cell:last-child{border-right:0;margin-right:0;}
.lbl{font-size:9px;letter-spacing:2.5px;color:var(--dim);}
.val{font-size:19px;font-weight:700;letter-spacing:1px;}
.val.gold{color:var(--gold);}
.val.pop{animation:pop .3s ease;}
@keyframes pop{40%{transform:scale(1.28);color:var(--gold)}}
.lives-row{display:flex;gap:5px;align-items:center;height:19px;}
.life{width:20px;height:7px;border-radius:4px;background:linear-gradient(180deg,#ffd9a0,#ff9f45);box-shadow:0 0 8px rgba(255,159,69,.5);}
.extra{color:var(--gold);font-size:13px;}
.chips{display:flex;gap:6px;}
.chip{font-size:9px;letter-spacing:1px;color:var(--dim);border:1px solid var(--line);border-radius:4px;
  padding:3px 7px 5px;opacity:.35;transition:opacity .2s,border-color .2s;}
.chip i{display:block;height:3px;margin-top:3px;background:var(--cc,#ffd93d);width:0%;border-radius:2px;transition:width .1s linear;}
.chip.on{opacity:1;color:var(--ink);border-color:var(--cc,#ffd93d);}
#chip-W{--cc:var(--mint)} #chip-S{--cc:var(--gold)} #chip-L{--cc:var(--coral)} #chip-X{--cc:#9aa7b5}

/* ── stage ───────────────────────────────── */
.stage{position:relative;margin:14px auto 10px;
  width:min(94vw,880px,calc((100vh - 232px) * 1.3333));
  width:min(94vw,880px,calc((100dvh - 232px) * 1.3333));
  touch-action:none;cursor:crosshair;}
canvas{display:block;width:100%;aspect-ratio:4/3;background:#071318;
  border:1px solid var(--line);border-radius:8px;
  box-shadow:inset 0 0 70px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.4);}
.stage::after{content:'';position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:8px;
  background:
   repeating-linear-gradient(0deg, rgba(0,0,0,.11) 0 2px, transparent 2px 4px),
   linear-gradient(115deg, rgba(255,255,255,.05) 0 10%, transparent 32%);}

/* ── overlays ────────────────────────────── */
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  background:rgba(4,15,20,.72);border-radius:8px;overflow:auto;cursor:default;}
.overlay.hidden{display:none;}
.ov-card{text-align:center;padding:26px 30px;max-width:600px;}
.ov-kicker{font-size:10px;letter-spacing:4px;color:var(--dim);margin-bottom:12px;}
.ov-title{font-family:var(--display);font-size:clamp(42px,8vw,72px);letter-spacing:3px;line-height:1;
  text-shadow:3px 3px 0 #062028,6px 6px 0 rgba(0,0,0,.35);}
.ov-title span{color:var(--amber);text-shadow:3px 3px 0 #4a2a05,0 0 26px rgba(255,180,84,.5);}
.ov-sub{color:var(--dim);font-size:13px;letter-spacing:1px;margin:12px 0 18px;}
.ov-sub b{color:var(--ink);} .ov-sub b.gold{color:var(--gold);}
.ov-blink{margin-top:16px;font-size:11px;letter-spacing:3px;color:var(--gold);animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
.ov-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.ov-bricks{display:flex;gap:4px;justify-content:center;margin:4px 0 20px;}
.ov-bricks i{width:34px;height:12px;border-radius:3px;animation:bob 1.6s ease-in-out infinite;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.4);}
@keyframes bob{50%{transform:translateY(-4px)}}
.ov-cols{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:24px;text-align:left;}
.ov-block h4{font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:8px;}
.ov-block ul{list-style:none;}
.ov-block li{font-size:12px;line-height:2;}
.ov-block li b{color:var(--amber);}
.pows{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;}
.pows li{display:flex;align-items:center;gap:8px;}
.pows i{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 8px rgba(255,255,255,.25);}
.newhi{color:var(--gold);font-size:14px;letter-spacing:3px;margin:6px 0 14px;animation:blink 1s infinite;}
.clearbar{width:220px;height:5px;background:#123039;border-radius:3px;margin:18px auto 0;overflow:hidden;}
.clearbar span{display:block;height:100%;width:100%;background:var(--gold);border-radius:3px;}

/* ── buttons ─────────────────────────────── */
.btn{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:12px 26px;border-radius:8px;border:1px solid transparent;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease,border-color .12s;}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
.btn-primary{background:var(--amber);color:#221302;box-shadow:0 4px 0 #8a5416,0 10px 26px rgba(255,180,84,.22);}
.btn-primary:hover{background:#ffc06a;transform:translateY(-2px);box-shadow:0 6px 0 #8a5416,0 16px 32px rgba(255,180,84,.32);}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5416;}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line2);}
.btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--cyan);}
.btn-sm{padding:7px 14px;font-size:11px;}

/* ── dock ────────────────────────────────── */
.dock{display:flex;justify-content:space-between;align-items:center;gap:10px 20px;flex-wrap:wrap;
  padding:10px 18px 14px;border-top:1px solid var(--line);background:#0a1f28;
  border-radius:0 0 9px 9px;font-size:11px;color:var(--dim);letter-spacing:1px;}
.hints{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.hints b{color:var(--ink);}
.legend{display:flex;gap:12px;flex-wrap:wrap;}
.lg{display:inline-flex;align-items:center;gap:6px;}
.lg i{width:9px;height:9px;border-radius:2px;background:var(--c);box-shadow:0 0 7px var(--c);}

@media (max-width:640px){
  .cell{padding-right:10px;margin-right:10px;}
  .val{font-size:15px;}
  .marquee-side{display:none;}
  .dock{justify-content:center;}
}
</style>
</head>
<body>
<div class="cabinet">
  <header class="marquee">
    <div class="marquee-title">BRICK<span>STORM</span></div>
    <div class="marquee-side">
      <span>HI-SCORE <b id="marquee-hi">000000</b></span>
      <span>CREDITS 01 · FREE PLAY</span>
    </div>
    <div class="bulbs"></div>
  </header>

  <div class="hud">
    <div class="cell"><span class="lbl">SCORE</span><span class="val" id="hud-score">000000</span></div>
    <div class="cell"><span class="lbl">HI-SCORE</span><span class="val gold" id="hud-hi">000000</span></div>
    <div class="cell"><span class="lbl">LEVEL</span><span class="val" id="hud-level">1/6</span></div>
    <div class="cell"><span class="lbl">COMBO</span><span class="val" id="hud-combo">—</span></div>
    <div class="cell"><span class="lbl">LIVES</span><span class="val lives-row" id="hud-lives"></span></div>
    <div class="cell"><span class="lbl">ACTIVE FX</span>
      <span class="chips">
        <span class="chip" id="chip-W"><i></i>WIDE</span>
        <span class="chip" id="chip-S"><i></i>SLOW</span>
        <span class="chip" id="chip-L"><i></i>LASER</span>
        <span class="chip" id="chip-X"><i></i>SHRINK</span>
      </span>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <footer class="dock">
    <div class="hints">
      <span><b>MOUSE</b> / <b>← →</b> MOVE</span>
      <span><b>SPACE</b> LAUNCH</span>
      <button class="btn btn-ghost btn-sm" id="btn-pause">PAUSE [P]</button>
      <button class="btn btn-ghost btn-sm" id="btn-sound">SOUND: ON</button>
    </div>
    <div class="legend">
      <span class="lg" style="--c:#45d6ff"><i></i>MULTI</span>
      <span class="lg" style="--c:#3ddc97"><i></i>WIDE</span>
      <span class="lg" style="--c:#ffd93d"><i></i>SLOW</span>
      <span class="lg" style="--c:#ff5d5d"><i></i>LASER</span>
      <span class="lg" style="--c:#ff5db1"><i></i>LIFE</span>
      <span class="lg" style="--c:#9aa7b5"><i></i>SHRINK</span>
    </div>
  </footer>
</div>
<noscript><p style="color:#e8f4f2">JavaScript is required to play.</p></noscript>

<script>
(()=>{ 'use strict';
/* ───────────────────────── canvas setup ───────────────────────── */
const $=id=>document.getElementById(id);
const canvas=$('game'), ctx=canvas.getContext('2d');
const stage=$('stage'), overlay=$('overlay');
const W=800, H=600;
const MONO="ui-monospace,Menlo,Consolas,monospace";
const DISPLAY="Impact,'Arial Black',sans-serif";
let dpr=1;
function fit(){ dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize',fit); fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(Math.max(0,Math.floor(n))).padStart(6,'0');

/* ───────────────────────── audio (synth) ───────────────────────── */
const SFX={ ctx:null, on:true,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  play(f,dur,type='square',vol=0.15,slide=0){
    if(!this.on||!this.ctx) return;
    const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  },
  seq(notes,gap=0.1,type='square',vol=0.15){
    if(!this.on||!this.ctx) return;
    notes.forEach((n,i)=>setTimeout(()=>this.play(n[0],n[1],type,vol,n[2]||0), i*gap*1000));
  }
};
function sfx(name,arg=0){
  if(!SFX.on||!SFX.ctx) return;
  switch(name){
    case 'paddle': SFX.play(190,.07,'square',.16,-70); break;
    case 'wall':   SFX.play(150,.05,'triangle',.10); break;
    case 'brick':  SFX.play(300+Math.min(arg,8)*70,.09,'square',.15,140); break;
    case 'steel':  SFX.play(95,.05,'sawtooth',.12); break;
    case 'power':  SFX.seq([[523,.08],[659,.08],[880,.14]]); break;
    case 'laser':  SFX.play(950,.12,'sawtooth',.06,-750); break;
    case 'launch': SFX.play(240,.08,'square',.12,220); break;
    case 'life':   SFX.seq([[311,.12,-120],[233,.14,-90],[155,.3,-70]],.13,'triangle',.2); break;
    case 'clear':  SFX.seq([[440,.1],[554,.1],[659,.1],[880,.24]],.11); break;
    case 'over':   SFX.seq([[330,.16,-90],[262,.16,-70],[196,.34,-60]],.17,'triangle',.2); break;
  }
}

/* ───────────────────────── data ───────────────────────── */
const TIER={
 '1':{hp:1,color:'#ff5d5d',light:'#ff9d94',dark:'#b83232',pts:50},
 '2':{hp:2,color:'#ff9f45',light:'#ffc78a',dark:'#c96a12',pts:80},
 '3':{hp:3,color:'#ffd93d',light:'#fff08a',dark:'#cfa400',pts:120},
 '4':{hp:4,color:'#3ddc97',light:'#8affc9',dark:'#149a63',pts:160},
 '5':{hp:5,color:'#45d6ff',light:'#9fe9ff',dark:'#1287b8',pts:220},
 'S':{hp:9999,color:'#8fa3b8',light:'#a9bccd',dark:'#4c5f70',pts:0,steel:true},
 'P':{hp:1,color:'#ff5db1',light:'#ff9dd4',dark:'#c22f86',pts:100,power:true},
};
const POWERS={
 M:{c:'#45d6ff',label:'MULTI-BALL'},
 W:{c:'#3ddc97',label:'WIDE PADDLE'},
 S:{c:'#ffd93d',label:'SLOW-MO'},
 L:{c:'#ff5d5d',label:'LASERS'},
 '+':{c:'#ff5db1',label:'EXTRA LIFE'},
 X:{c:'#9aa7b5',label:'SHRINK!'},
};
const POWER_WEIGHTS=[['M',26],['W',24],['S',20],['L',16],['+',8],['X',10]];
function rollPower(){ let t=0; for(const w of POWER_WEIGHTS) t+=w[1];
  let r=Math.random()*t; for(const [k,w] of POWER_WEIGHTS){ r-=w; if(r<=0) return k; } return 'M'; }

const LEVELS=[
 {name:'WARM-UP', map:["............","111111111111","1111P111P111","111111111111","111111111111","............","............","............"]},
 {name:'CHECKER', map:["2.2.2.2.2.2.",".2.2.2.2.2.2","2.2.2.2.2.2.",".2.2.P.2.2.2","2.2.2.2.2.2.",".2.2.2.2.2.2","............","............"]},
 {name:'PYRAMID', map:[".....33.....","....3333....","...333333...","..33333333..",".2222222222.","222222222222","............","............"]},
 {name:'COLUMNS', map:["S.S.S.S.S.S.","4.4.4.4.4.4.","4.4.4.4.4.4.","4.4.P.4.4.4.","4.4.4.4.4.4.","4.4.4.4.4.4.","............","............"]},
 {name:'BASTION', map:["SSSSSSSSSSSS","555555555555","5.5.5.5.5.5.","555555555555","5.5.5.5.5.5.","555555555555","............","............"]},
 {name:'THE CORE',map:["S...5555...S","...555555...","..55555555..",".5555555555.","..55555555..","...555555...","S...5555...S","............"]},
];

/* ───────────────────────── state ───────────────────────── */
function loadHi(){ try{ return +localStorage.getItem('brickstorm.hi')||0; }catch(e){ return 0; } }
function saveHi(){ try{ localStorage.setItem('brickstorm.hi',G.hi); }catch(e){} }
const G={ state:'menu', score:0, hi:loadHi(), startHi:0, level:0, lives:3,
  combo:0, shake:0, flash:0, intro:0, clearTimer:0, prev:'play',
  demo:null, newHi:false, baseSpeed:330, maxSpeed:570 };
const paddle={ x:W/2, w:110, baseW:110, y:H-46, h:14, squash:0 };
let balls=[], bricks=[], powerups=[], lasers=[], particles=[], texts=[];
const fx={ wide:0, slow:0, laser:0, shrink:0 };
let laserTimer=0, mouseTarget=W/2;
const keys={ l:false, r:false };
const ambient=Array.from({length:42},()=>({x:Math.random()*W,y:Math.random()*H,
  r:.6+Math.random()*1.6, s:4+Math.random()*12, a:.04+Math.random()*.09, p:Math.random()*6}));

function makeBall(x,y,vx,vy){ return {x,y,vx,vy,r:7,trail:[],stuck:false,off:0,dead:false}; }

function buildLevel(i){
  const L=LEVELS[i]; bricks=[];
  const cols=12,bw=60,bh=22,gap=4;
  const ox=(W-(cols*(bw+gap)-gap))/2, oy=64;
  L.map.forEach((row,r)=>{ for(let c=0;c<row.length;c++){
    const ch=row[c]; if(ch==='.'||ch===' ') continue;
    const d=TIER[ch];
    bricks.push({x:ox+c*(bw+gap), y:oy+r*(bh+gap), w:bw, h:bh, ch,
      hp:d.hp, max:d.hp, alive:true, flash:0, seed:((r*53+c*17)&1023)});
  }});
}
function resetServe(){
  paddle.x=W/2; paddle.w=paddle.baseW;
  fx.wide=fx.slow=fx.laser=fx.shrink=0; laserTimer=0;
  powerups.length=0; lasers.length=0;
  const off=Math.random()*40-20;
  balls.length=0;
  const b=makeBall(W/2+off,paddle.y-10,0,0); b.stuck=true; b.off=off;
  balls.push(b); G.intro=1.8;
}
function startGame(){
  G.score=0; G.lives=3; G.level=0; G.combo=0; G.newHi=false;
  G.startHi=G.hi; G.demo=null;
  G.baseSpeed=330; G.maxSpeed=570;
  buildLevel(0); resetServe();
  G.state='serve'; hideOverlay(); syncHUD();
}
function nextLevel(){
  if(G.state!=='levelclear') return;
  G.level++; G.baseSpeed=330+G.level*25; G.maxSpeed=G.baseSpeed+240;
  buildLevel(G.level); resetServe();
  G.state='serve'; hideOverlay(); syncHUD();
}
function launch(){
  const b=balls[0]; if(!b||!b.stuck) return;
  b.stuck=false;
  const a=Math.random()*.5-.25, sp=G.baseSpeed;
  b.vx=Math.sin(a)*sp; b.vy=-Math.cos(a)*sp;
  G.state='play'; sfx('launch');
}
function levelClear(){
  const last=G.level===LEVELS.length-1;
  const bonus= last?2500 : 300+(G.level+1)*200;
  G.score+=bonus; G.combo=0; sfx('clear'); syncHUD();
  if(last){ G.state='victory'; G.newHi=G.score>G.startHi; saveHi(); showOverlay('victory'); }
  else{ G.state='levelclear'; G.clearTimer=3.6;
    showOverlay('clear',{num:G.level+2, next:LEVELS[G.level+1].name, bonus}); }
}
function loseLife(){
  G.lives--; G.combo=0; G.shake=13; G.flash=.7; sfx('life'); syncHUD();
  if(G.lives<=0){ G.state='gameover'; G.newHi=G.score>G.startHi; saveHi(); showOverlay('gameover'); }
  else{ G.state='serve'; resetServe(); }
}
function togglePause(){
  if(G.state==='play'||G.state==='serve'){ G.prev=G.state; G.state='pause'; showOverlay('pause'); }
  else if(G.state==='pause'){ G.state=G.prev; hideOverlay(); }
}
function doAct(a){
  SFX.init();
  if(a==='start'||a==='retry') startGame();
  else if(a==='resume') togglePause();
  else if(a==='menu'){ G.state='menu'; G.demo=newDemo(); showOverlay('menu'); }
  else if(a==='continue') nextLevel();
}
function action(){
  if(G.state==='menu') doAct('start');
  else if(G.state==='serve') launch();
  else if(G.state==='pause') doAct('resume');
  else if(G.state==='gameover'||G.state==='victory') doAct('retry');
  else if(G.state==='levelclear') nextLevel();
}

/* ───────────────────────── HUD ───────────────────────── */
const elScore=$('hud-score'), elHi=$('hud-hi'), elLevel=$('hud-level'),
      elCombo=$('hud-combo'), elLives=$('hud-lives'), elHiM=$('marquee-hi');
const chipEls={W:$('chip-W'),S:$('chip-S'),L:$('chip-L'),X:$('chip-X')};
const FXMAX={W:12,S:8,L:10,X:8};
function setTxt(el,v){ if(el._v!==v){ el._v=v; el.textContent=v; } }
function pop(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function syncHUD(){
  if(G.score>G.hi){ G.hi=G.score; saveHi(); }
  const prev=elScore._v;
  setTxt(elScore,pad(G.score));
  if(elScore._v!==prev && G.state==='play') pop(elScore);
  setTxt(elHi,pad(G.hi)); setTxt(elHiM,pad(G.hi));
  setTxt(elLevel,(G.level+1)+'/'+LEVELS.length);
  if(elLives._n!==G.lives){
    elLives._n=G.lives;
    const n=Math.max(0,Math.min(G.lives,5));
    elLives.innerHTML=Array.from({length:n},()=>'<i class="life"></i>').join('')
      +(G.lives>5?'<b class="extra">+'+(G.lives-5)+'</b>':'');
  }
}
function syncCombo(){
  const v=G.combo>=2?'x'+Math.min(G.combo,8):'—';
  if(elCombo._v!==v){ elCombo._v=v; elCombo.textContent=v; pop(elCombo); }
}
function syncFX(){
  for(const k in chipEls){
    const c=chipEls[k], on=fx[k]>0;
    if(c._on!==on){ c._on=on; c.classList.toggle('on',on); }
    if(on) c.querySelector('i').style.width=(fx[k]/FXMAX[k]*100)+'%';
  }
}

/* ───────────────────────── effects ───────────────────────── */
function burst(x,y,color,n=12){
  if(particles.length>380) return;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=60+Math.random()*220;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,
      life:.5+Math.random()*.4,max:.9,rot:Math.random()*6,vr:Math.random()*8-4,
      s:2+Math.random()*4,color}); }
}
function sparks(x,y,n=5){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:.25+Math.random()*.2,max:.45,rot:0,vr:0,s:1.5+Math.random()*2,color:'#ffe9a0'}); }
}
function floatText(x,y,txt,color){ if(texts.length>30) texts.shift();
  texts.push({x,y,txt,color,life:1}); }

function hitBrick(br,fromBall){
  const d=TIER[br.ch]; br.flash=1;
  if(d.steel){ sparks(br.x+br.w/2,br.y+br.h/2); sfx('steel'); G.shake=Math.max(G.shake,2); return; }
  br.hp--;
  if(br.hp>0){ sparks(br.x+br.w/2,br.y+br.h/2,3); sfx('brick',Math.min(G.combo,8)); return; }
  br.alive=false;
  burst(br.x+br.w/2,br.y+br.h/2,d.color,12);
  if(fromBall){
    G.combo++;
    const mult=Math.min(G.combo,8), pts=d.pts*mult;
    G.score+=pts;
    floatText(br.x+br.w/2,br.y+br.h/2,(mult>1?'x'+mult+' ':'')+'+'+pts,d.color);
    sfx('brick',G.combo); G.shake=Math.max(G.shake,1.6);
  }else{
    G.score+=d.pts;
    floatText(br.x+br.w/2,br.y+br.h/2,'+'+d.pts,d.color);
  }
  if(d.power||Math.random()<0.12)
    powerups.push({x:br.x+br.w/2,y:br.y+br.h/2,type:rollPower(),t:Math.random()*6,dead:false});
  syncHUD(); syncCombo();
}
function applyPower(type){
  const d=POWERS[type];
  floatText(paddle.x,paddle.y-26,d.label,d.c); sfx('power');
  switch(type){
    case 'M': for(const b of balls){ if(b.stuck) continue; if(balls.length>=6) break;
      const sp=Math.max(300,Math.hypot(b.vx,b.vy)), a=-Math.PI/2+(Math.random()*.9-.45);
      balls.push(makeBall(b.x,b.y,Math.sin(a)*sp,-Math.cos(a)*sp)); } break;
    case 'W': fx.wide=12; break;
    case 'S': fx.slow=8; break;
    case 'L': fx.laser=10; laserTimer=.2; break;
    case '+': G.lives++; break;
    case 'X': fx.shrink=8; break;
  }
  syncHUD();
}

/* ───────────────────────── update ───────────────────────── */
function updatePaddle(dt){
  const pw=paddle.baseW*(fx.wide>0?1.5:1)*(fx.shrink>0?0.62:1);
  paddle.w=pw;
  if(keys.l) paddle.x-=660*dt;
  else if(keys.r) paddle.x+=660*dt;
  else paddle.x+=(mouseTarget-paddle.x)*Math.min(1,dt*13);
  paddle.x=clamp(paddle.x,pw/2+4,W-pw/2-4);
  paddle.squash=Math.max(0,paddle.squash-dt*5);
}
function update(dt){
  for(const k in fx) if(fx[k]>0) fx[k]=Math.max(0,fx[k]-dt);
  updatePaddle(dt);
  const ts=fx.slow>0?0.62:1, bdt=dt*ts;
  if(fx.laser>0){ laserTimer-=dt;
    if(laserTimer<=0){ laserTimer=.45;
      lasers.push({x:paddle.x-paddle.w/2+18,y:paddle.y-8,dead:false},
                  {x:paddle.x+paddle.w/2-18,y:paddle.y-8,dead:false});
      sfx('laser'); } }
  for(const l of lasers){
    l.y-=920*dt; if(l.y<-12){ l.dead=true; continue; }
    for(const br of bricks){ if(!br.alive) continue;
      if(l.x>br.x-2&&l.x<br.x+br.w+2&&l.y>br.y-2&&l.y<br.y+br.h){
        if(TIER[br.ch].steel){ sparks(l.x,br.y); sfx('steel'); }
        else hitBrick(br,false);
        l.dead=true; break; } }
  }
  lasers=lasers.filter(l=>!l.dead);
  for(const b of balls){
    if(b.stuck){ b.x=paddle.x+b.off; b.y=paddle.y-b.r-3; continue; }
    const sp=Math.hypot(b.vx,b.vy);
    const steps=Math.max(1,Math.ceil(sp*bdt/8)), s=bdt/steps;
    for(let i=0;i<steps&&!b.dead;i++){
      b.x+=b.vx*s; b.y+=b.vy*s;
      if(b.x<b.r){ b.x=b.r; if(b.vx<0){ b.vx=-b.vx; sfx('wall'); } }
      else if(b.x>W-b.r){ b.x=W-b.r; if(b.vx>0){ b.vx=-b.vx; sfx('wall'); } }
      if(b.y<b.r){ b.y=b.r; if(b.vy<0){ b.vy=-b.vy; sfx('wall'); } }
      if(b.vy>0 && b.y+b.r>=paddle.y && b.y-b.r<=paddle.y+paddle.h
         && Math.abs(b.x-paddle.x)<=paddle.w/2+b.r){
        const rel=clamp((b.x-paddle.x)/(paddle.w/2),-1,1);
        const spd=Math.min(G.maxSpeed,Math.hypot(b.vx,b.vy)+12);
        b.vx=Math.sin(rel*1.05)*spd; b.vy=-Math.cos(rel*1.05)*spd;
        b.y=paddle.y-b.r-.5; paddle.squash=1;
        if(G.combo>0){ G.combo=0; syncCombo(); }
        sfx('paddle');
      }
      if(!b.dead){
        for(const br of bricks){ if(!br.alive) continue;
          if(b.x+b.r<br.x||b.x-b.r>br.x+br.w||b.y+b.r<br.y||b.y-b.r>br.y+br.h) continue;
          const cx=clamp(b.x,br.x,br.x+br.w), cy=clamp(b.y,br.y,br.y+br.h);
          const dx=b.x-cx, dy=b.y-cy;
          if(dx===0&&dy===0) b.vy*=-1;
          else if(Math.abs(dx)>Math.abs(dy)) b.vx=Math.sign(dx)*Math.abs(b.vx);
          else b.vy=Math.sign(dy)*Math.abs(b.vy);
          hitBrick(br,true); break; }
      }
      if(b.y-b.r>H+12) b.dead=true;
    }
    if(!b.stuck){ b.trail.push({x:b.x,y:b.y}); if(b.trail.length>9) b.trail.shift(); }
  }
  balls=balls.filter(b=>!b.dead);
  if(balls.length===0){ loseLife(); return; }
  for(const p of powerups){
    p.y+=130*bdt; p.t+=dt;
    if(p.y>H+20) p.dead=true;
    if(!p.dead && p.y>paddle.y-16 && p.y<paddle.y+paddle.h+14
       && Math.abs(p.x-paddle.x)<paddle.w/2+15){ p.dead=true; applyPower(p.type); }
  }
  powerups=powerups.filter(p=>!p.dead);
  if(G.intro>0) G.intro-=dt;
  if(G.state==='play' && !bricks.some(b=>b.alive&&!TIER[b.ch].steel)) levelClear();
}
/* attract-mode demo behind the title screen */
function newDemo(){ const a=Math.random()*Math.PI*2, sp=250;
  return {x:W/2,y:H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7,trail:[],stuck:false,off:0,dead:false}; }
function updateDemo(dt){
  const b=G.demo; if(!b) return;
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx); }
  if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx); }
  if(b.y<b.r){ b.y=b.r; b.vy=Math.abs(b.vy); }
  if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h
     &&Math.abs(b.x-paddle.x)<=paddle.w/2+b.r){ b.vy=-Math.abs(b.vy); b.vx+=Math.random()*120-60; }
  for(const br of bricks){ if(!br.alive) continue;
    if(b.x+b.r<br.x||b.x-b.r>br.x+br.w||b.y+b.r<br.y||b.y-b.r>br.y+br.h) continue;
    const cx=clamp(b.x,br.x,br.x+br.w), cy=clamp(b.y,br.y,br.y+br.h);
    const dx=b.x-cx, dy=b.y-cy;
    if(dx===0&&dy===0) b.vy*=-1;
    else if(Math.abs(dx)>Math.abs(dy)) b.vx=Math.sign(dx)*Math.abs(b.vx);
    else b.vy=Math.sign(dy)*Math.abs(b.vy);
    br.hp--; br.flash=1;
    if(br.hp<=0){ br.alive=false; burst(b.x,b.y,TIER[br.ch].color,6); }
    break; }
  b.trail.push({x:b.x,y:b.y}); if(b.trail.length>9) b.trail.shift();
  if(b.y-b.r>H+20 || !bricks.some(x=>x.alive&&!TIER[x.ch].steel)){
    buildLevel(0); G.demo=newDemo(); }
}

/* ───────────────────────── draw ───────────────────────── */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBrick(br,t){
  const d=TIER[br.ch];
  if(d.steel){
    ctx.fillStyle='#54677a'; rrect(br.x,br.y,br.w,br.h,4); ctx.fill();
    ctx.strokeStyle='#2b3a47'; ctx.lineWidth=1.5;
    rrect(br.x+.75,br.y+.75,br.w-1.5,br.h-1.5,3); ctx.stroke();
    ctx.fillStyle='#93a9bd';
    for(const [rx,ry] of [[6,6],[br.w-6,6],[6,br.h-6],[br.w-6,br.h-6]])
      ctx.fillRect(br.x+rx-1.5,br.y+ry-1.5,3,3);
  }else{
    const g=ctx.createLinearGradient(0,br.y,0,br.y+br.h);
    g.addColorStop(0,d.light); g.addColorStop(.5,d.color); g.addColorStop(1,d.dark);
    ctx.fillStyle=g; rrect(br.x,br.y,br.w,br.h,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fillRect(br.x+3,br.y+2.5,br.w-6,2.5);
    if(br.hp<br.max){
      ctx.strokeStyle='rgba(8,18,24,.55)'; ctx.lineWidth=1.2;
      const n=br.max-br.hp;
      for(let i=0;i<n;i++){
        const sx=br.x+6+((br.seed*13+i*29)%(br.w-12));
        ctx.beginPath(); ctx.moveTo(sx,br.y+1);
        let px=sx, py=br.y+1;
        for(let s=0;s<3;s++){ px+=((br.seed+i*7+s*13)%9)-4; py+=br.h/3.4; ctx.lineTo(px,py); }
        ctx.stroke(); }
    }
    if(d.power){
      const a=.35+.4*(.5+.5*Math.sin(t*5+br.seed));
      ctx.strokeStyle=`rgba(255,93,177,${a.toFixed(2)})`; ctx.lineWidth=2;
      rrect(br.x-2,br.y-2,br.w+4,br.h+4,6); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='700 12px '+MONO;
      ctx.textAlign='center'; ctx.fillText('★',br.x+br.w/2,br.y+br.h/2+4);
    }
  }
  if(br.flash>0){ ctx.fillStyle=`rgba(255,255,255,${(br.flash*.7).toFixed(2)})`;
    rrect(br.x,br.y,br.w,br.h,4); ctx.fill(); }
}
function drawPaddle(){
  const pw=paddle.w, sq=paddle.squash;
  ctx.save();
  ctx.translate(paddle.x,paddle.y+paddle.h/2);
  ctx.scale(1+sq*.18,1-sq*.25);
  ctx.shadowColor='rgba(255,180,84,.55)'; ctx.shadowBlur=16;
  const g=ctx.createLinearGradient(0,-paddle.h/2,0,paddle.h/2);
  g.addColorStop(0,'#f7fbfa'); g.addColorStop(1,'#9fb6bd');
  ctx.fillStyle=g; rrect(-pw/2,-paddle.h/2,pw,paddle.h,7); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffb454';
  rrect(-pw/2,-paddle.h/2,10,paddle.h,4); ctx.fill();
  rrect(pw/2-10,-paddle.h/2,10,paddle.h,4); ctx.fill();
  if(fx.laser>0){ ctx.fillStyle='#ff5d5d';
    ctx.fillRect(-pw/2+14,-paddle.h/2-5,8,6);
    ctx.fillRect(pw/2-22,-paddle.h/2-5,8,6); }
  ctx.restore();
}
function drawBall(b){
  const n=b.trail.length;
  for(let i=0;i<n;i++){ const p=b.trail[i], f=(i+1)/n;
    ctx.globalAlpha=f*.25; ctx.fillStyle='#ffd93d';
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r*f,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.save(); ctx.shadowColor='rgba(255,220,120,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle='#fff8e8'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  ctx.restore();
}
function drawPower(p){
  const d=POWERS[p.type];
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.sin(p.t*3)*.25);
  ctx.shadowColor=d.c; ctx.shadowBlur=12;
  ctx.fillStyle=d.c; rrect(-14,-9,28,18,5); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.font='700 12px '+MONO; ctx.textAlign='center';
  ctx.fillText(p.type,0,4);
  ctx.restore();
}
function draw(t){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0c2833'); bg.addColorStop(.55,'#081a22'); bg.addColorStop(1,'#050f14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(110,200,230,.045)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=40;x<W;x+=40){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=40;y<H;y+=40){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  for(const a of ambient){ ctx.globalAlpha=a.a; ctx.fillStyle='#9fd8e8';
    ctx.fillRect(a.x,a.y,a.r,a.r); }
  ctx.globalAlpha=1;

  ctx.save();
  if(G.shake>0.2) ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);
  for(const br of bricks) if(br.alive) drawBrick(br,t);
  for(const p of powerups) drawPower(p);
  for(const l of lasers){ ctx.save(); ctx.shadowColor='#ff5d5d'; ctx.shadowBlur=10;
    ctx.fillStyle='#ffd0c0'; ctx.fillRect(l.x-2,l.y-8,4,16); ctx.restore(); }
  drawPaddle();
  for(const b of balls) drawBall(b);
  if(G.state==='menu'&&G.demo) drawBall(G.demo);
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); }
  ctx.globalAlpha=1;
  for(const ft of texts){ ctx.globalAlpha=Math.max(0,ft.life);
    ctx.fillStyle=ft.color; ctx.font='700 13px '+MONO; ctx.textAlign='center';
    ctx.fillText(ft.txt,ft.x,ft.y); }
  ctx.globalAlpha=1;
  ctx.restore();

  const dg=ctx.createLinearGradient(0,H-16,0,H);
  dg.addColorStop(0,'rgba(255,93,93,0)'); dg.addColorStop(1,'rgba(255,93,93,.28)');
  ctx.fillStyle=dg; ctx.fillRect(0,H-16,W,16);

  if(G.intro>0&&(G.state==='serve'||G.state==='play')){
    const a=G.intro>1.4?(1.8-G.intro)/.4:Math.min(1,G.intro/1.2);
    ctx.globalAlpha=clamp(a,0,1); ctx.textAlign='center';
    ctx.fillStyle='#7fa8b0'; ctx.font='700 13px '+MONO;
    ctx.fillText('LEVEL '+(G.level+1)+' / '+LEVELS.length,W/2,H/2-38);
    ctx.fillStyle='#f4f7f7'; ctx.font='400 44px '+DISPLAY;
    ctx.fillText(LEVELS[G.level].name,W/2,H/2+4);
    ctx.globalAlpha=1;
  }
  if(G.state==='serve'){
    ctx.globalAlpha=.35+.45*(.5+.5*Math.sin(t*5));
    ctx.fillStyle='#ffd93d'; ctx.font='700 14px '+MONO; ctx.textAlign='center';
    ctx.fillText('SPACE / CLICK TO LAUNCH',W/2,H-24);
    ctx.globalAlpha=1;
  }
  if(G.flash>0){ ctx.fillStyle=`rgba(255,70,70,${(G.flash*.4).toFixed(3)})`;
    ctx.fillRect(0,0,W,H); }
}

/* ───────────────────────── main loop ───────────────────────── */
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const now=t/1000;
  if(!last) last=now;
  const dt=Math.min(.033,now-last); last=now;
  for(const a of ambient){ a.y-=a.s*dt; a.x+=Math.sin(now*.5+a.p)*4*dt;
    if(a.y<-4){ a.y=H+4; a.x=Math.random()*W; } }
  G.shake=Math.max(0,G.shake-dt*26);
  G.flash=Math.max(0,G.flash-dt*1.4);
  for(const br of bricks) if(br.flash>0) br.flash=Math.max(0,br.flash-dt*5);
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=320*dt;
    p.rot+=p.vr*dt; p.life-=dt; }
  if(particles.length) particles=particles.filter(p=>p.life>0);
  for(const ft of texts){ ft.y-=34*dt; ft.life-=dt*.9; }
  if(texts.length) texts=texts.filter(f=>f.life>0);

  if(G.state==='play') update(dt);
  else if(G.state==='serve'){
    updatePaddle(dt);
    for(const b of balls) if(b.stuck){ b.x=paddle.x+b.off; b.y=paddle.y-b.r-3; }
    if(G.intro>0) G.intro-=dt;
  }
  else if(G.state==='menu'){
    const b=G.demo;
    if(b){ paddle.x+=(b.x-paddle.x)*Math.min(1,dt*3);
      paddle.x=clamp(paddle.x,paddle.w/2+4,W-paddle.w/2-4); }
    updateDemo(dt);
  }
  else if(G.state==='levelclear'){
    G.clearTimer-=dt;
    const bar=$('clearbar');
    if(bar) bar.style.width=(Math.max(0,G.clearTimer)/3.6*100)+'%';
    if(G.clearTimer<=0) nextLevel();
  }
  syncFX();
  draw(now);
}

/* ───────────────────────── input ───────────────────────── */
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k===' ') e.preventDefault();
  if(e.repeat){ if(k==='ArrowLeft')keys.l=true; if(k==='ArrowRight')keys.r=true; return; }
  if(k==='ArrowLeft'||k==='a'||k==='A') keys.l=true;
  else if(k==='ArrowRight'||k==='d'||k==='D') keys.r=true;
  else if(k===' '||k==='Enter'){ SFX.init(); action(); }
  else if(k==='p'||k==='P'){ if(G.state!=='menu') togglePause(); }
  else if(k==='m'||k==='M') toggleMute();
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') keys.l=false;
  if(k==='ArrowRight'||k==='d'||k==='D') keys.r=false;
});
stage.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseTarget=(e.clientX-r.left)/r.width*W;
});
stage.addEventListener('click',()=>{ SFX.init(); action(); });
stage.addEventListener('touchstart',e=>{
  e.preventDefault(); SFX.init();
  const r=canvas.getBoundingClientRect(), t=e.touches[0];
  mouseTarget=(t.clientX-r.left)/r.width*W; action();
},{passive:false});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect(), t=e.touches[0];
  mouseTarget=(t.clientX-r.left)/r.width*W;
},{passive:false});
overlay.addEventListener('click',e=>{
  e.stopPropagation(); SFX.init();
  const b=e.target.closest('[data-act]');
  if(b) doAct(b.dataset.act); else action();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&(G.state==='play'||G.state==='serve')) togglePause();
});
$('btn-pause').addEventListener('click',e=>{
  e.stopPropagation(); SFX.init();
  if(G.state==='play'||G.state==='serve'||G.state==='pause') togglePause();
});
function toggleMute(){
  SFX.on=!SFX.on;
  try{ localStorage.setItem('brickstorm.mute',SFX.on?'0':'1'); }catch(e){}
  $('btn-sound').textContent='SOUND: '+(SFX.on?'ON':'OFF');
}
$('btn-sound').addEventListener('click',e=>{ e.stopPropagation(); SFX.init(); toggleMute(); });
try{ if(localStorage.getItem('brickstorm.mute')==='1'){ SFX.on=false;
  $('btn-sound').textContent='SOUND: OFF'; } }catch(e){}

/* ───────────────────────── boot ───────────────────────── */
buildLevel(0);
G.demo=newDemo();
showOverlay('menu');
syncHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
